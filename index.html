<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#e6eae6"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style></head><body><title>ลองจัดห้อง</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* Layout: แถบบน · เครื่องมือซ้าย · เวทีแปลน 2D / ภาพ 3D ตรงกลาง · แผงขวา
   มือถือ: เวทีเต็มกว้าง แผงเป็นชีตย่อ/ขยายได้ เครื่องมืออยู่แถวล่างสุด
   สี: กระดาษเขียนแบบเทาอมเขียว หมึกน้ำเงินเข้ม ปากกาเน้นสีเขียวหัวเป็ด */
:root{
  --bg:#e6eae6; --surface:#f8f9f6; --plan:#f2f4f0; --ink:#1d282d; --muted:#5b686d; --line:#d0d8d3;
  --wall:#26313a; --accent:#0d7a72; --accent-ink:#ffffff; --accent-soft:rgba(13,122,114,.12);
  --warn:#c13d29; --warn-soft:rgba(193,61,41,.14); --grid:rgba(29,40,45,.055); --grid-major:rgba(29,40,45,.12);
  --item-line:rgba(29,40,45,.42); --scene:#dce1db; --ground:#c9d0c6; --scrim:rgba(12,18,20,.48);
  --shadow:0 1px 2px rgba(12,18,20,.08),0 4px 14px rgba(12,18,20,.08);
  --font-display:"Bai Jamjuree","IBM Plex Sans Thai","Leelawadee UI",system-ui,sans-serif;
  --font-body:"IBM Plex Sans Thai","Noto Sans Thai","Leelawadee UI",system-ui,sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1518; --surface:#172024; --plan:#131b1e; --ink:#dce5e7; --muted:#8f9ca1; --line:#29353a;
    --wall:#c3cfd3; --accent:#3dbcb0; --accent-ink:#082022; --accent-soft:rgba(61,188,176,.16);
    --warn:#ff7d66; --warn-soft:rgba(255,125,102,.2); --grid:rgba(220,229,231,.045); --grid-major:rgba(220,229,231,.1);
    --item-line:rgba(220,229,231,.4); --scene:#1a2327; --ground:#20292d; --scrim:rgba(0,0,0,.6);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.3); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1518; --surface:#172024; --plan:#131b1e; --ink:#dce5e7; --muted:#8f9ca1; --line:#29353a;
  --wall:#c3cfd3; --accent:#3dbcb0; --accent-ink:#082022; --accent-soft:rgba(61,188,176,.16);
  --warn:#ff7d66; --warn-soft:rgba(255,125,102,.2); --grid:rgba(220,229,231,.045); --grid-major:rgba(220,229,231,.1);
  --item-line:rgba(220,229,231,.4); --scene:#1a2327; --ground:#20292d; --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.3); color-scheme:dark;
}
html{height:100%;box-sizing:border-box;-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}
@supports (height:100dvh){html{height:100dvh}}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
.app,.home{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
@media (pointer:coarse){input{font-size:16px!important}}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--font-body);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:grid;grid-template-columns:74px minmax(0,1fr) 330px;grid-template-rows:auto minmax(0,1fr);grid-template-areas:"bar bar bar" "tools stage side";gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{grid-area:bar;display:flex;align-items:center;gap:8px;min-width:0}
.brand{display:flex;align-items:center;gap:8px;font:600 18px/1 var(--font-display);letter-spacing:.01em;white-space:nowrap;padding-right:4px}
.brand svg{color:var(--accent)}
.myplans{display:inline-flex;align-items:center;gap:7px;flex:none;height:36px;padding:0 13px;border:1.5px solid var(--accent);border-radius:9px;background:var(--accent-soft);color:var(--accent);font:600 14px var(--font-display);white-space:nowrap}
.myplans:hover{background:var(--accent);color:var(--accent-ink)}
.curp{display:flex;align-items:center;gap:8px;min-width:0;max-width:340px;padding:0 4px}
.pname{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.pstate{font-size:12px;color:var(--muted);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot[data-s="cloud"]{background:var(--accent)}
.dot[data-s="err"]{background:var(--warn)}
.dot[data-s="saving"]{animation:pulse 1s infinite}
.grow{flex:1}
.ib{width:36px;height:36px;flex:none;display:inline-grid;place-items:center;border:1px solid var(--line);border-radius:9px;background:var(--surface)}
.ib.lb{width:auto;display:inline-flex;align-items:center;gap:6px;padding:0 11px;font-size:13px;font-weight:500}
.seg{display:inline-flex;flex:none;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:2px;gap:2px}
.seg button{height:30px;padding:0 11px;border-radius:7px;font:600 13px var(--font-display);color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.tools{grid-area:tools;display:flex;flex-direction:column;gap:6px;overflow-y:auto;min-height:0}
.tool{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 7px;border-radius:10px;color:var(--muted);font-size:11.5px;line-height:1.2;text-align:center}
.tool:hover{background:var(--surface)}
.tool[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.stage{grid-area:stage;position:relative;display:grid;grid-template-columns:minmax(0,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--plan);min-height:0;min-width:0}
.stage[data-view="split"]{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.stage[data-view="2d"] .p3d,.stage[data-view="3d"] .p2d{display:none}
.stage[data-view="split"] .p3d{border-left:1px solid var(--line)}
.pane{position:relative;min-width:0;min-height:0;overflow:hidden}
.pane canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.p3d{background:var(--scene)}
.ov{position:absolute;top:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100% - 20px)}
.ovb{height:34px;min-width:34px;padding:0 8px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);border-radius:9px;background:var(--surface);box-shadow:var(--shadow);font-size:12.5px;white-space:nowrap}
.ovb[aria-pressed="true"]{color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent),var(--shadow)}
.hint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);width:max-content;max-width:calc(100% - 24px);background:var(--ink);color:var(--surface);padding:7px 12px;border-radius:9px;font-size:13px;box-shadow:var(--shadow);text-align:center}
.drawbar{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);width:max-content;max-width:calc(100% - 24px);display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 8px;padding:8px 10px;background:var(--surface);border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow);font-size:13px}
.drawbar .dlen{display:flex;align-items:center;gap:6px;color:var(--muted)}
.drawbar input{width:84px;height:30px;padding:0 8px;border:1px solid var(--line);border-radius:7px;background:var(--plan);color:var(--ink);font:500 13px var(--font-num)}
.scalebar{position:absolute;left:12px;bottom:12px;display:flex;flex-direction:column;gap:3px;font:500 11px var(--font-num);color:var(--muted);pointer-events:none}
.scalebar i{display:block;height:6px;border:1.5px solid var(--muted);border-top:0}
.floorbar{position:absolute;top:10px;left:10px;z-index:3;display:flex;gap:2px;padding:3px;max-width:calc(50% - 20px);overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface);box-shadow:var(--shadow);scrollbar-width:none}
.floorbar button{flex:none;height:30px;padding:0 11px;border-radius:7px;font:600 13px var(--font-display);color:var(--muted);white-space:nowrap}
.floorbar button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.floorbar .fadd{color:var(--accent);padding:0 9px}
.stage[data-view="3d"] .floorbar,.stage[data-view="2d"] .floorbar{max-width:calc(100% - 70px)}
.stage[data-view="3d"] .floorbar{top:auto;bottom:12px}
.stage[data-view="3d"] .fab{top:10px}
.fab{position:absolute;top:56px;left:10px;display:flex;flex-wrap:wrap;gap:2px;padding:4px;max-width:calc(100% - 20px);border:1px solid var(--line);border-radius:11px;background:var(--surface);box-shadow:var(--shadow);z-index:2}
.fab button{height:34px;padding:0 9px;display:inline-flex;align-items:center;gap:6px;border-radius:8px;font-size:12.5px;white-space:nowrap}
.fab button:hover{background:var(--accent-soft)}
.fab .danger{color:var(--warn)}
@media (max-width:599px){.fab .fl,.ovb span,.ib.lb span,#redoBtn,.brand,.curp{display:none}.myplans{padding:0 10px;font-size:13.5px}.seg button{padding:0 9px}.fab button{padding:0 10px}.ib.lb{width:36px;padding:0;justify-content:center}.ov{flex-direction:column}.bar{gap:6px}}
@media (max-width:359px){.myplans span{display:none}.myplans{width:36px;padding:0;justify-content:center}.bar{gap:4px}.seg button{padding:0 7px}}
.joy{position:absolute;left:16px;bottom:16px;width:116px;height:116px;border-radius:50%;background:var(--surface);opacity:.9;border:1px solid var(--line);box-shadow:var(--shadow);touch-action:none}
.knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:var(--accent);pointer-events:none}
.hint3{position:absolute;right:12px;bottom:12px;max-width:calc(100% - 160px);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:6px 10px;font-size:12.5px;color:var(--muted);box-shadow:var(--shadow)}
.no3d{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted)}
.side{grid-area:side;display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tabs{display:flex;align-items:stretch;border-bottom:1px solid var(--line);flex:none}
.tab{flex:1;min-width:0;padding:11px 6px 9px;font:600 13.5px var(--font-display);color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.sheetTog{display:none;width:44px;flex:none;place-items:center;color:var(--muted)}
.side[data-open="0"] .sheetTog svg{transform:rotate(180deg)}
.sbody{flex:1;min-height:0;overflow:auto;padding:12px 14px 16px;overscroll-behavior:contain}
.sbody h3{margin:16px 0 7px;font:600 12.5px var(--font-display);color:var(--muted);letter-spacing:.02em}
.sbody h3:first-child{margin-top:2px}
.f3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
.f input,.in-name,.search input{width:100%;height:36px;padding:0 9px;border:1px solid var(--line);border-radius:8px;background:var(--plan);color:var(--ink);font:500 14px var(--font-num)}
.in-name,.search input{font:500 14.5px var(--font-body)}
.in-name{font-weight:600}
.btnrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.btn{min-height:34px;padding:0 11px;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:13px}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--warn)}
.btn.armed{background:var(--warn);border-color:var(--warn);color:var(--surface)}
.btn.sm{min-height:28px;padding:0 9px;font-size:12px}
.sep{padding-top:12px;margin-top:14px;border-top:1px solid var(--line)}
.sw{display:flex;flex-wrap:wrap;gap:7px}
.sw button{width:28px;height:28px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.14),0 0 0 1px var(--line)}
.sw button[aria-pressed="true"]{box-shadow:inset 0 0 0 1px rgba(0,0,0,.14),0 0 0 2px var(--surface),0 0 0 4px var(--accent)}
.sw .def{width:auto;padding:0 9px;border-radius:999px;background:var(--plan);font-size:11.5px;color:var(--muted)}
.status{margin-top:8px;padding:7px 10px;border-radius:8px;font-size:13px}
.status.ok{background:var(--accent-soft);color:var(--accent)}
.status.bad{background:var(--warn-soft);color:var(--warn)}
.rng{display:flex;align-items:center;gap:10px;font-size:13px}.rng span{white-space:nowrap}.rng input{flex:1;accent-color:var(--accent)}
.vchips{display:flex;flex-wrap:wrap;gap:6px}.vchip{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}.vchip button{padding:5px 11px;font-size:13px}.vchip button+button{border-left:1px solid var(--line);color:var(--muted);padding:5px 9px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin-top:10px;font-size:13px}
.kv b{font:500 14px var(--font-num);text-align:right}
.walls{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.walls li{display:flex;align-items:center;gap:8px;padding:3px 4px 3px 4px;border-radius:8px;background:var(--plan)}
.walls li.on{box-shadow:inset 0 0 0 1.5px var(--accent)}
.walls .wl{flex:1;display:flex;justify-content:space-between;gap:8px;padding:4px 6px;text-align:left;font-size:13px;border-radius:6px}
.walls b{font:500 13px var(--font-num)}
.seg.sm button{height:28px;font-size:12.5px}
.search{margin-top:2px}
.cats{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;margin-top:10px;scrollbar-width:thin}
.chip{flex:none;height:30px;padding:0 11px;border:1px solid var(--line);border-radius:999px;font-size:12.5px;white-space:nowrap;background:var(--surface)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(94px,1fr));gap:8px;margin-top:8px}
.card{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 5px 7px;border:1px solid var(--line);border-radius:10px;background:var(--plan);min-width:0}
.card:hover{border-color:var(--accent)}
.card canvas{width:76px;height:58px}
.card .nm{font-size:12px;line-height:1.25;text-align:center;overflow-wrap:anywhere}
.card .dm{font:500 10.5px var(--font-num);color:var(--muted)}
.rooms{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.flrow{display:flex;align-items:center;gap:6px}
.flrow .in-name{flex:1;min-width:0;height:32px;font-size:14px}
.rooms button{width:100%;display:flex;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:8px;background:var(--plan);text-align:left}
.num{font-family:var(--font-num);font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.chk{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13.5px}
.help{margin:0;padding-left:18px;color:var(--muted);font-size:13px;display:flex;flex-direction:column;gap:3px}
.muted{color:var(--muted)}
.small{font-size:12px}
.empty{color:var(--muted);font-size:13.5px;padding:6px 0 2px}
.ttl{font:600 16px var(--font-display)}
.home{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.hbar{display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--surface)}
.hbrand{display:flex;align-items:center;gap:8px;font:600 18px/1 var(--font-display);white-space:nowrap}
.hbrand svg{color:var(--accent)}
.hscroll{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain}
.hwrap{max-width:1200px;margin:0 auto;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hhead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
.hhead h1{margin:0;font:600 30px/1.15 var(--font-display);text-wrap:balance}
.hhead p{margin:6px 0 0;font-size:13.5px;max-width:62ch}
.hhead .btnrow{margin-top:0}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin-top:22px}
.pcard{display:flex;flex-direction:column;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pcard.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.pthumb{position:relative;display:block;width:100%;max-width:100%;aspect-ratio:4/3;background:var(--plan);border-bottom:1px solid var(--line)}
.pthumb canvas{display:block;width:100%;height:100%}
.pthumb:hover{filter:brightness(1.02)}
.badge{position:absolute;top:10px;left:10px;padding:3px 10px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:600}
.pbody{display:flex;flex-direction:column;gap:3px;padding:12px;min-width:0}
.pc-name{font:600 16.5px/1.3 var(--font-display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbody .in-name{height:32px;font-size:15px}
.pmeta{font-size:12.5px;color:var(--muted)}
.pacts{display:flex;align-items:center;gap:6px;margin-top:9px}
.ib.sm{width:34px;height:34px}
.ib.danger{color:var(--warn)}
.ib.armed{width:auto;padding:0 10px;background:var(--warn);border-color:var(--warn);color:var(--surface);font-size:12.5px;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(10px);opacity:0;pointer-events:none;background:var(--ink);color:var(--surface);padding:8px 14px;border-radius:9px;font-size:13.5px;box-shadow:var(--shadow);transition:opacity .2s,transform .2s;z-index:60;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.drawbar input[type="range"]{width:170px;max-width:42vw;height:auto;padding:0;border:0;background:none;accent-color:var(--accent)}
.stage[data-view="3d"] .p3d .drawbar{bottom:58px}
.p3d .ov{max-width:min(calc(100% - 20px),450px)}
@media (max-width:599px){.p3d .ov{flex-direction:row;flex-wrap:wrap;justify-content:flex-end}}
.pmodal{position:fixed;inset:0;z-index:55;display:grid;place-items:center;padding:16px;background:var(--scrim)}
.pbox{width:min(940px,100%);display:flex;flex-direction:column;gap:10px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.phead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pview{height:min(54vh,440px);height:min(54dvh,440px);border-radius:10px;background-color:#000;background-repeat:repeat-x;background-size:auto 100%;cursor:grab;touch-action:none}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.toast{transition:none}.dot[data-s="saving"]{animation:none}}

  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto auto;grid-template-areas:"bar" "stage" "side" "tools";gap:8px;padding-block:8px}

const matCache={};
function mat(color,o){
  const k=color+'|'+(o?JSON.stringify(o):'');
  if(!matCache[k]) matCache[k]=new T.MeshStandardMaterial(Object.assign({color:color,roughness:0.78,metalness:0},o||{}));
  return matCache[k];
}

const GLOWS=[];

/* ---------------- เรขาคณิต ---------------- */
function area2(p){ let s=0; for(let i=0;i<p.length;i++){ const a=p[i], b=p[(i+1)%p.length]; s+=a[0]*b[1]-b[0]*a[1]; } return s; }
function pip(x,y,p){ let c=false; for(let i=0,j=p.length-1;i<p.length;j=i++){ const a=p[i], b=p[j]; if(((a[1]>y)!==(b[1]>y))&&(x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0])) c=!c; } return c; }
function segProj(px,py,ax,ay,bx,by){ const dx=bx-ax, dy=by-ay, L2=dx*dx+dy*dy; const t=L2?clamp(((px-ax)*dx+(py-ay)*dy)/L2,0,1):0; const qx=ax+dx*t, qy=ay+dy*t; return {t,x:qx,y:qy,d:Math.hypot(px-qx,py-qy)}; }
function edgeOf(room,i){ const p=room.pts, n=p.length, a=p[i], b=p[(i+1)%n]; const dx=b[0]-a[0], dy=b[1]-a[1], L=Math.hypot(dx,dy)||1e-9; const ux=dx/L, uy=dy/L, s=area2(p)>0?1:-1; return {a,b,ux,uy,len:L,nx:s*uy,ny:-s*ux}; }
function outerPt(room,i,t){ const n=room.pts.length, e1=edgeOf(room,(i-1+n)%n), e2=edgeOf(room,i); const mx=e1.nx+e2.nx, my=e1.ny+e2.ny; let k=1+e1.nx*e2.nx+e1.ny*e2.ny; if(k<0.15) k=0.15; return [room.pts[i][0]+mx/k*t, room.pts[i][1]+my/k*t]; }
function bboxPts(p){ let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; p.forEach(q=>{ if(q[0]<x0)x0=q[0]; if(q[0]>x1)x1=q[0]; if(q[1]<y0)y0=q[1]; if(q[1]>y1)y1=q[1]; }); return {x0,y0,x1,y1}; }
function isRect(r){ const p=r.pts; if(p.length!==4) return false; for(let i=0;i<4;i++){ const a=p[i], b=p[(i+1)%4]; if(Math.abs(a[0]-b[0])>1e-6&&Math.abs(a[1]-b[1])>1e-6) return false; } return true; }
const LPC=new Map();
function labelPoint(p){
  const key=JSON.stringify(p); if(LPC.has(key)) return LPC.get(key);
  const b=bboxPts(p), st=Math.max(0.05,Math.min(b.x1-b.x0,b.y1-b.y0)/24); let best=null, bd=-1;
  for(let y=b.y0+st/2;y<b.y1;y+=st) for(let x=b.x0+st/2;x<b.x1;x+=st){ if(!pip(x,y,p)) continue; let md=1e9; for(let i=0;i<p.length;i++){ const a=p[i], c=p[(i+1)%p.length]; const d=segProj(x,y,a[0],a[1],c[0],c[1]).d; if(d<md) md=d; } if(md>bd){ bd=md; best=[x,y]; } }
  const r=best||[(b.x0+b.x1)/2,(b.y0+b.y1)/2]; if(LPC.size>200) LPC.clear(); LPC.set(key,r); return r;
}
function itemCorners(it,shrink){ const a=it.rot*Math.PI/180, c=Math.cos(a), s=Math.sin(a), hw=it.w/2-(shrink||0), hd=it.d/2-(shrink||0); return [[-hw,-hd],[hw,-hd],[hw,hd],[-hw,hd]].map(q=>[it.x+q[0]*c-q[1]*s, it.y+q[0]*s+q[1]*c]); }
function inItem(it,px,py,pad){ const a=it.rot*Math.PI/180, c=Math.cos(a), s=Math.sin(a), dx=px-it.x, dy=py-it.y; const lx=dx*c+dy*s, ly=-dx*s+dy*c; pad=pad||0; return Math.abs(lx)<=it.w/2+pad&&Math.abs(ly)<=it.d/2+pad; }
function ext(it){ const a=it.rot*Math.PI/180; let c=Math.abs(Math.cos(a)), s=Math.abs(Math.sin(a)); if(c<1e-9)c=0; if(s<1e-9)s=0; return [it.w*c+it.d*s, it.w*s+it.d*c]; }
const isAxis=it=>{ const m=((it.rot%90)+90)%90; return m<0.01||m>89.99; };
function overlapItems(a,b){
  const pa=itemCorners(a,0.002), pb=itemCorners(b,0.002), axes=[];
  [a,b].forEach(it=>{ const r=it.rot*Math.PI/180, c=Math.cos(r), s=Math.sin(r); axes.push([c,s],[-s,c]); });
  for(const ax of axes){ let mnA=1e9,mxA=-1e9,mnB=1e9,mxB=-1e9; for(let t=0;t<4;t++){ const da=pa[t][0]*ax[0]+pa[t][1]*ax[1], db=pb[t][0]*ax[0]+pb[t][1]*ax[1]; if(da<mnA)mnA=da; if(da>mxA)mxA=da; if(db<mnB)mnB=db; if(db>mxB)mxB=db; } if(mxA<=mnB||mxB<=mnA) return false; }
  return true;
}
const topOf=it=>(it.elev||0)+(it.tx||it.tz?-2*tiltLow(it):it.h);
function ignorePair(a,b){ const A=C[a.type]||{}, B=C[b.type]||{}; if(A.flat||B.flat||A.elec||B.elec) return true; if(a.on===b.id||b.on===a.id) return true; if((A.tuck&&B.table)||(B.tuck&&A.table)) return true; if((A.table&&(b.elev||0)>=0.6)||(B.table&&(a.elev||0)>=0.6)) return true; return !((a.elev||0)<topOf(b)-0.005&&(b.elev||0)<topOf(a)-0.005); }
function raySeg(px,py,dx,dy,ax,ay,bx,by){ const ex=bx-ax, ey=by-ay, den=dx*ey-dy*ex; if(Math.abs(den)<1e-9) return null; const t=((ax-px)*ey-(ay-py)*ex)/den, u=((ax-px)*dy-(ay-py)*dx)/den; if(t<-1e-6||u<-1e-6||u>1+1e-6) return null; return t; }

/* บันไดอยู่ที่ชั้นล่าง ชั้นบนถัดไปจึงมีช่องโล่งตรงตำแหน่งเดียวกัน */
const stairHoles=k=>k>0&&P.floors[k-1]?P.floors[k-1].items.filter(isStair):[];

/* ---------------- ตรวจชน + พื้นที่ว่าง ---------------- */
function computeProblems(){
  PROB={}; const S=doorSectors(), holes=stairHoles(P.cur);
  P.items.forEach(it=>{
    if(isElec(it)) return;
    const list=[]; const room=roomAt(it.x,it.y);
    if(room&&itemCorners(it,0.006).some(q=>!pip(q[0],q[1],room.pts))) list.push('ชนผนัง');
    if(S.some(s=>sectorHits(s,it))) list.push('ขวางประตู');
    if(!isFlat(it)&&holes.some(h=>overlapItems(it,h))) list.push('ทับช่องบันได');
    P.items.forEach(o=>{ if(o!==it&&!ignorePair(it,o)&&overlapItems(it,o)) list.push('ชน '+nameOf(o)); });
    if(list.length) PROB[it.id]=[...new Set(list)];

}
function computeStats(){
  STATS={};
  P.rooms.forEach(r=>{
    const A=Math.abs(area2(r.pts))/2, b=bboxPts(r.pts), st=0.05; let tot=0, free=0;
    const its=P.items.filter(it=>!isFlat(it)&&!isElec(it)&&(it.elev||0)<1.0).filter(it=>{ const e=ext(it); return it.x+e[0]/2>b.x0&&it.x-e[0]/2<b.x1&&it.y+e[1]/2>b.y0&&it.y-e[1]/2<b.y1; });
    const shs=P.shapes.filter(s=>s.elev<1.0&&!s.sweep);
    for(let y=b.y0+st/2;y<b.y1;y+=st) for(let x=b.x0+st/2;x<b.x1;x+=st){ if(!pip(x,y,r.pts)) continue; tot++; if(!its.some(it=>inItem(it,x,y,0))&&!shs.some(s=>pip(x,y,s.pts)&&!(s.hole&&pip(x,y,s.hole)))) free++; }
    STATS[r.id]={area:A,free:tot?A*free/tot:A};

}

const CEIL_GAP=0.03;

/* ของที่วางบนของอื่น (it.on) ตามของที่รองไปทุกวิธี: ลาก 2D/3D กลุ่ม ปุ่มลูกศร พิมพ์ขนาด/มุม

const RIDE={}, LASTPOS={};

function followSupports(){
  if(!P) return;

    for(let pass=0;pass<5;pass++){ let moved=false;
      f.items.forEach(r=>{ const sp=r.on&&byId[r.on]; if(!sp){ delete RIDE[r.id]; return; }
        const H=itemH(sp)||1, sig=[sp.x,sp.y,sp.rot,sp.elev||0,H,sp.w,sp.d].join(','), k=RIDE[r.id];

          r.x=rd(sp.x+lx*c-ly*sn); r.y=rd(sp.y+lx*sn+ly*c); r.elev=rd(Math.max(0,(sp.elev||0)+k.fe*H)); r.rot=((sp.rot+k.dr)%360+360)%360; moved=true; }
        const a=-sp.rot*D2R, c=Math.cos(a), sn=Math.sin(a), dx=r.x-sp.x, dy=r.y-sp.y;
        RIDE[r.id]={s:sp.id,sig,fx:sp.w?(dx*c-dy*sn)/sp.w:0,fy:sp.d?(dx*sn+dy*c)/sp.d:0,fe:((r.elev||0)-(sp.elev||0))/H,dr:r.rot-sp.rot}; });

/* จุดสายไฟที่อยู่กลางของไฟฟ้า ย้ายตามของนั้นทุกวิธีที่ย้าย */
function followWires(){
  if(!P) return;
  P.floors.forEach(f=>f.items.forEach(it=>{ if(!(isElec(it)||isLight(it))) return; const lp=LASTPOS[it.id];
    if(lp&&(lp[0]!==it.x||lp[1]!==it.y)) f.wires.forEach(w=>w.pts.forEach((q,i)=>{ if(Math.hypot(q[0]-lp[0],q[1]-lp[1])<0.02) w.pts[i]=[it.x,it.y]; }));
    LASTPOS[it.id]=[it.x,it.y]; }));
}

        [xs,xs-256].forEach(px=>{ x.fillStyle=c; x.fillRect(px,r*rh,128,rh); x.fillStyle='rgba(0,0,0,0.16)'; x.fillRect(px,r*rh,1.5,rh); });

    x.lineWidth=1.4; for(let i=0;i<900;i++){ const px=rn()*256, py=rn()*256, l=4+rn()*7; x.strokeStyle=shade(color,(rn()-0.45)*0.5); x.beginPath(); x.moveTo(px,py); x.lineTo(px+(rn()-0.5)*3,py-l); x.stroke(); }

/* ---------------- ลอกผนังจากรูปแปลนอัตโนมัติ (ทำในเครื่องนี้ ไม่ส่งรูปไปไหน) ----------------
   1) ย่อรูป แล้วแยกเส้นเข้ม (ผนัง) ด้วยค่าแบ่งอัตโนมัติแบบ Otsu
   2) ลบเส้นบาง (ตัวหนังสือ เส้นเฟอร์นิเจอร์) ด้วยการกัดแล้วพองกลับ
   3) พองผนังอีก ~42 ซม. ให้ช่องประตูปิด แล้วหาที่ว่างที่มีผนังล้อมรอบ = ห้อง
   4) ตามขอบแต่ละห้อง ทำเส้นให้เรียบ ขยายกลับเท่าที่พองไว้ แล้วดัดให้ตรงแนวแกน */
function morph(src,w,h,r,dil){

  for(let x=0;x<w;x++){ for(let y=0;y<h;y++) acc[y+1]=acc[y]+tmp[y*w+x]; for(let y=0;y<h;y++){ const s=acc[Math.min(h,y+r+1)]-acc[Math.max(0,y-r)]; out[y*w+x]=dil?(s>0?1:0):(s===full?1:0); } }

function disposeTree(o){ o.traverse(m=>{ if(m.geometry) m.geometry.dispose(); }); }
function prism(q,y0,y1,mats,hole){ const s=new T.Shape(q.map(p=>new T.Vector2(p[0],-p[1]))); if(hole) s.holes.push(new T.Path(hole.map(p=>new T.Vector2(p[0],-p[1])))); const g=new T.ExtrudeGeometry(s,{depth:Math.max(0.001,y1-y0),bevelEnabled:false}); const m=new T.Mesh(g,mats); m.rotation.x=-Math.PI/2; m.position.y=y0; m.castShadow=true; m.receiveShadow=true; return m; }
const TEX={};

/* พื้นห้อง เจาะช่องบันไดของชั้นล่าง (เฉพาะช่องที่อยู่ในห้องทั้งหมด) */
function floorShape(r,holes){
  const s=new T.Shape(r.pts.map(p=>new T.Vector2(p[0],-p[1])));
  holes.forEach(h=>{ const cs=itemCorners(h,0.01); if(cs.every(q=>pip(q[0],q[1],r.pts))) s.holes.push(new T.Path(cs.map(q=>new T.Vector2(q[0],-q[1])))); });
  return s;
}
function bounds3d(){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; const add=(x,y)=>{ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; };
  P.floors.slice(0,P.cur+1).forEach(f=>{ f.rooms.forEach(r=>r.pts.forEach(q=>{ add(q[0]-P.wallT,q[1]-P.wallT); add(q[0]+P.wallT,q[1]+P.wallT); })); f.items.forEach(it=>itemCorners(it).forEach(q=>add(q[0],q[1]))); });

}
const roofShown=()=>UI.roof&&P.cur===P.floors.length-1;
function buildShell(){
  disposeTree(R3.shell); while(R3.shell.children.length) R3.shell.remove(R3.shell.children[0]); R3.walls=[]; R3.floors=[];
  for(let k=0;k<=P.cur;k++){ const fl=P.floors[k], ey=elevOf(k), holes=stairHoles(k), groups={};
  fl.rooms.forEach(r=>{
    const f=new T.Mesh(new T.ShapeGeometry(floorShape(r,holes)),floorMat(r)); f.rotation.x=-Math.PI/2; f.position.y=ey+0.001; f.receiveShadow=true; f.userData.room=r.id; R3.shell.add(f); if(k===P.cur) R3.floors.push(f);
    if(k>0){ const sl=new T.Mesh(new T.ExtrudeGeometry(floorShape(r,holes),{depth:SLAB-0.004,bevelEnabled:false}),[mat('#f4f2ed',{roughness:0.95}),mat('#d9d4ca',{roughness:0.95})]); sl.rotation.x=-Math.PI/2; sl.position.y=ey-SLAB; sl.castShadow=true; sl.receiveShadow=true; R3.shell.add(sl); }

      const post=(u,y0,y1)=>{ const p=at(u), b=addBox(g,0.07,y1-y0,TT+0.02,FRAME,p[0],y0,p[1]); b.rotation.y=rot; b.userData={}; };

        else if(pc.kind==='lintel'){ beam(pc.u0,pc.u1,pc.y0+0.03,false); beam(pc.u0,pc.u1,pc.y1-0.03,false); }

/* ช่องลมในผนัง: บล็อกช่องลม (ตารางลายดอก) และช่องเกล็ด (ใบเกล็ดเอียง + มุ้งลวด) วางจากฐาน y=0 กว้าง w สูง h หนา d */
function ventFrame(g,w,h,d,color){ const t=0.03; addBox(g,w,t,d,color,0,0,0); addBox(g,w,t,d,color,0,h-t,0); addBox(g,t,h,d,color,-w/2+t/2,0,0); addBox(g,t,h,d,color,w/2-t/2,0,0); return t; }
function blockGrid(g,w,h,d,color){
  const t=ventFrame(g,w,h,d,color), n=Math.max(1,Math.round(w/0.2)), m=Math.max(1,Math.round(h/0.2)), cw=w/n, ch=h/m, s=Math.min(cw,ch)*0.38;
  for(let i=1;i<n;i++) addBox(g,t*0.8,h,d,color,-w/2+cw*i,0,0);
  for(let j=1;j<m;j++) addBox(g,w,t*0.8,d,color,0,ch*j-t*0.4,0);
  for(let i=0;i<n;i++) for(let j=0;j<m;j++){ const b=addBox(g,s,s,d*0.5,color,-w/2+cw*(i+0.5),ch*(j+0.5)-s/2,0); b.rotation.z=Math.PI/4; }
}
function louver(g,w,h,d,color){
  const t=ventFrame(g,w,h,d,color), n=Math.max(2,Math.round((h-2*t)/0.05));
  for(let i=0;i<n;i++){ const s=addBox(g,w-2*t,0.006,d*0.9,shade(color,-0.08),0,t+(h-2*t)*(i+0.5)/n-0.003,0); s.rotation.x=-0.7; }
  addBox(g,w-2*t,h-2*t,0.004,'#3a3d42',0,t,-d*0.42,{transparent:true,opacity:0.25,depthWrite:false});
}
/* ลูกหมุนระบายความร้อนบนหลังคา (หัวหมุนรอบแกนตั้ง) */
function turbine(g,p){
  const t=new T.Group(); t.position.copy(p); g.add(t); const o={metalness:.55,roughness:.38};
  addCyl(t,0.12,0.15,0.3,'#b9bfc5',0,-0.06,0,o,16);
  const head=new T.Group(); head.position.y=0.24; head.userData.spin={ax:'y',v:2.4,roof:1}; t.add(head);
  addCyl(head,0.23,0.23,0.02,'#c9ced3',0,0,0,o,20);
  for(let i=0;i<18;i++){ const a=i/18*Math.PI*2, f=addBox(head,0.012,0.26,0.09,'#d5dadf',Math.cos(a)*0.21,0.02,Math.sin(a)*0.21,o); f.rotation.y=-a+0.6; }

function renderThumb(k){
  const [type,color]=k.split('|'); const c=C[type]; if(!c) return;
  const mx=Math.max(c.w,c.d), px=256/mx, W=Math.max(8,Math.round(c.w*px)), H=Math.max(8,Math.round(c.d*px));
  const g=new T.Group(); c.make(g,{type,color:color||undefined}); R3.tScene.add(g);
  const cam=R3.tCam; cam.left=-c.w/2; cam.right=c.w/2; cam.top=c.d/2; cam.bottom=-c.d/2; cam.near=0.01; cam.far=c.h+4; cam.position.set(0,c.h+2,0); cam.up.set(0,0,-1); cam.lookAt(0,0,0); cam.updateProjectionMatrix();
  const r=R3.renderer, lc=r.localClippingEnabled; r.localClippingEnabled=false; R3.rt.setSize(W,H); r.setRenderTarget(R3.rt); r.setClearColor(0x000000,0); r.clear(); r.render(R3.tScene,cam); r.localClippingEnabled=lc;
  const buf=new Uint8Array(W*H*4); r.readRenderTargetPixels(R3.rt,0,0,W,H,buf); r.setRenderTarget(null);
  R3.tScene.remove(g); disposeTree(g);
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H; const x=cv.getContext('2d'); const img=x.createImageData(W,H);
  for(let y=0;y<H;y++) img.data.set(buf.subarray((H-1-y)*W*4,(H-y)*W*4),y*W*4);
  x.putImageData(img,0,0); TH[k]={cv};
}
function processThumbs(){ let n=0; while(THQ.length&&n<4){ try{ renderThumb(THQ.shift()); }catch(e){} n++; } if(n){ need2=true; need3=true; drawCardThumbs(); if(UI.home) drawHomeThumbs(); } }
function drawCardThumbs(){
  document.querySelectorAll('canvas[data-th]').forEach(cv=>{
    if(cv.dataset.done) return; const k=cv.dataset.th, c=C[k]; const th=thumb(k,null);
    const x=cv.getContext('2d'), W=cv.width, H=cv.height; const sc=Math.min((W-8)/c.w,(H-8)/c.d), w=c.w*sc, d=c.d*sc;
    if(th){ x.clearRect(0,0,W,H); x.drawImage(th,(W-w)/2,(H-d)/2,w,d); cv.dataset.done='1'; }
    else if(!R3.ok){ x.clearRect(0,0,W,H); x.fillStyle='#b9b2a5'; x.fillRect((W-w)/2,(H-d)/2,w,d); cv.dataset.done='1'; }
  });
}

/* ---------------- เลือกหลายชิ้น · จับกลุ่ม (แบบ SketchUp Groups) ----------------
   SEL={kind:'multi',items:[id],shapes:[id],grp?} · ของในกลุ่มมี .grp = id กลุ่ม ชื่อกลุ่มอยู่ที่ floor.groups */
const getGroup=id=>(curFloor().groups||[]).find(g=>g.id===id);
const inMulti=(k,id)=>!!(SEL&&SEL.kind==='multi'&&(k==='item'?SEL.items:SEL.shapes).includes(id));
function multiObj(){ const items=SEL.items.map(getItem).filter(Boolean), shapes=SEL.shapes.map(getShape).filter(Boolean); return items.length+shapes.length?{items,shapes}:null; }
function groupSel(gid){ return {kind:'multi',items:P.items.filter(o=>o.grp===gid).map(o=>o.id),shapes:P.shapes.filter(o=>o.grp===gid).map(o=>o.id),grp:gid}; }
function multiBox(m){ const pts=[]; m.items.forEach(it=>itemCorners(it).forEach(q=>pts.push(q))); m.shapes.forEach(s=>s.pts.forEach(q=>pts.push(q))); return bboxPts(pts); }
/* แตะของที่อยู่ในกลุ่ม = เลือกทั้งกลุ่ม · แตะชิ้นเดิมซ้ำ = แก้ชิ้นเดียว */
function selectHit(h){
  const ob=h.kind==='item'?getItem(h.id):h.kind==='shape'?getShape(h.id):null;
  if(ob&&ob.grp&&!(SEL&&SEL.kind==='multi'&&SEL.grp===ob.grp)&&!(SEL&&SEL.id===h.id)){ select(groupSel(ob.grp)); return; }
  select({kind:h.kind,id:h.id});
}
function setMulti(items,shapes){
  items=[...new Set(items)].filter(id=>getItem(id)); shapes=[...new Set(shapes)].filter(id=>getShape(id));
  if(!items.length&&!shapes.length){ select(null,true); return; }
  if(items.length+shapes.length===1){ select(items.length?{kind:'item',id:items[0]}:{kind:'shape',id:shapes[0]}); return; }
  const m={kind:'multi',items,shapes}, g0=(getItem(items[0])||getShape(shapes[0])||{}).grp;
  if(g0){ const gs=groupSel(g0); if(gs.items.length===items.length&&gs.shapes.length===shapes.length&&items.every(id=>gs.items.includes(id))&&shapes.every(id=>gs.shapes.includes(id))) m.grp=g0; }
  select(m);
}
function curMulti(){ if(SEL&&SEL.kind==='multi') return [SEL.items.slice(),SEL.shapes.slice()]; if(SEL&&SEL.kind==='item') return [[SEL.id],[]]; if(SEL&&SEL.kind==='shape') return [[],[SEL.id]]; return [[],[]]; }
/* เพิ่มทั้งกลุ่มเมื่อแตะชิ้นที่อยู่ในกลุ่ม */
function withGroups(items,shapes){ const gs=new Set([...items.map(getItem),...shapes.map(getShape)].filter(o=>o&&o.grp).map(o=>o.grp)); gs.forEach(g=>{ P.items.forEach(o=>{ if(o.grp===g) items.push(o.id); }); P.shapes.forEach(o=>{ if(o.grp===g) shapes.push(o.id); }); }); return [items,shapes]; }
function toggleMulti(k,id){
  const ob=k==='item'?getItem(id):getShape(id); if(!ob) return; let [its,shs]=curMulti();
  const ids=ob.grp?withGroups(k==='item'?[id]:[],k==='shape'?[id]:[]):[k==='item'?[id]:[],k==='shape'?[id]:[]];
  const has=(k==='item'?its:shs).includes(id);
  if(has){ its=its.filter(x=>!ids[0].includes(x)); shs=shs.filter(x=>!ids[1].includes(x)); } else { its.push(...ids[0]); shs.push(...ids[1]); }
  setMulti(its,shs);
}
function addMulti(items,shapes){ const [a,b]=curMulti(); const [x,y]=withGroups(items.slice(),shapes.slice()); setMulti(a.concat(x),b.concat(y)); }
/* กลุ่มที่เหลือไม่ถึง 2 ชิ้นจะถูกยกเลิกเอง */
function tidyGroups(){
  if(!P) return;
  P.floors.forEach(f=>{ const all=f.items.concat(f.shapes), cnt={}; all.forEach(x=>{ if(x.grp) cnt[x.grp]=(cnt[x.grp]||0)+1; }); all.forEach(x=>{ if(x.grp&&cnt[x.grp]<2) delete x.grp; });
    f.groups=(f.groups||[]).filter(g=>cnt[g.id]>=2); Object.keys(cnt).forEach(k=>{ if(cnt[k]>=2&&!f.groups.some(g=>g.id===k)) f.groups.push({id:k,name:'กลุ่ม'}); }); });
  if(SEL&&SEL.kind==='multi'&&SEL.grp&&!getGroup(SEL.grp)) SEL.grp=null;
}
function startMulti(g){
  const m=multiObj(); if(!m){ g.type='pan'; return; } g.type='multi';
  const ids=new Set(m.items.map(x=>x.id)), extra=[]; m.items.forEach(it=>ridersOf(it).forEach(r=>{ if(!ids.has(r.id)&&!extra.includes(r)) extra.push(r); }));
  g.its=m.items.concat(extra).map(o=>({id:o.id,x:o.x,y:o.y})); g.shs=m.shapes.map(s=>({id:s.id,src:deep({pts:s.pts,hole:s.hole})}));
}
function moveMulti(g,dx,dy){ g.its.forEach(r=>{ const o=getItem(r.id); if(o){ o.x=rd(r.x+dx); o.y=rd(r.y+dy); } }); g.shs.forEach(r=>{ const s=getShape(r.id); if(s) xfShape(s,r.src,q=>[rd(q[0]+dx),rd(q[1]+dy)]); }); g.moved=true; live(); }
/* ทำสำเนาทั้งชุด (ของ+รูปทรง) เลื่อนไป dx,dy · ถ้าเป็นกลุ่มจะได้กลุ่มใหม่ */
function copySet(m,dx,dy,grpName){
  const ng=grpName?uid('g'):null, map={}, items=[], shapes=[];
  m.items.forEach(it=>{ const c=deep(it); c.id=uid('i'); map[it.id]=c.id; c.x=rd(it.x+dx); c.y=rd(it.y+dy); if(ng) c.grp=ng; else delete c.grp; items.push(c); });
  items.forEach(c=>{ if(c.on){ if(map[c.on]) c.on=map[c.on]; else delete c.on; } });
  m.shapes.forEach(s=>{ const c=deep(s); c.id=uid('s'); xfShape(c,s,q=>[rd(q[0]+dx),rd(q[1]+dy)]); if(ng) c.grp=ng; else delete c.grp; shapes.push(c); });
  P.items.push(...items); P.shapes.push(...shapes); if(ng) curFloor().groups.push({id:ng,name:grpName});
  return {kind:'multi',items:items.map(o=>o.id),shapes:shapes.map(o=>o.id),grp:ng};
}

/* ---------------- วางของซ้อนบนของ (โต๊ะ ชั้นวาง ตู้) ----------------
   it.on = id ของที่รองอยู่ข้างล่าง · ย้าย/หมุนของที่รอง ของข้างบนจะไปด้วย */
const D2R=Math.PI/180;
function ridersOf(it,acc){ acc=acc||[]; P.items.forEach(o=>{ if(o.on===it.id&&o!==it&&!acc.includes(o)){ acc.push(o); ridersOf(o,acc); } }); return acc; }
function canStack(it){ const c=C[it.type]||{}; return !(c.flat||c.elec||c.ceil||c.stair||(c.elev||0)>=1.0); } /* ของติดผนัง (สูงจากพื้นตั้งแต่ 1 ม.) ไม่วางซ้อน */
/* มุมล่างสุดของกล่องหลังเอียง (เทียบกับกึ่งกลาง): ใช้วางฐานของที่เอียงให้แตะระดับ elev พอดี */
function tiltLow(it){
  const H=itemH(it), tx=(it.tx||0)*D2R, tz=(it.tz||0)*D2R; if(!tx&&!tz) return -H/2;
  const cx=Math.cos(tx), sx=Math.sin(tx), cz=Math.cos(tz), sz=Math.sin(tz); let lo=0;
  for(const a of [-it.w/2,it.w/2]) for(const b of [-H/2,H/2]) for(const c of [-it.d/2,it.d/2]){ const y=(a*sz+b*cz)*cx-c*sx; if(y<lo) lo=y; }
  return lo;
}
function moveRiders(g,it){ (g.riders||[]).forEach(r=>{ const o=getItem(r.id); if(o){ o.x=rd(r.x+it.x-g.ix); o.y=rd(r.y+it.y-g.iy); o.elev=rd(Math.max(0,r.elev+(it.elev||0)-g.ie)); } }); }
function rotRiders(list,it,deg){ const a=deg*D2R, c=Math.cos(a), s=Math.sin(a); (list||[]).forEach(r=>{ const o=getItem(r.id); if(!o) return; o.x=rd(it.x+(r.x-it.x)*c-(r.y-it.y)*s); o.y=rd(it.y+(r.x-it.x)*s+(r.y-it.y)*c); o.rot=((r.rot+deg)%360+360)%360; }); }
/* พื้นผิวที่หงายขึ้นของ o ใต้ตำแหน่งของ it: ยิงเส้นลงจากด้านบนใส่โมเดล 3D (ได้ทุกชั้นของชั้นวาง) */
function surfacesOf(o,it){
  const top=rd(topOf(o)); if(!R3.ok||!R3.items[o.id]) return [top];
  R3.scene.updateMatrixWorld(); const ey=elevOf(P.cur), out=[], a=it.rot*D2R, c=Math.cos(a), s=Math.sin(a), ray=new T.Raycaster(), dn=new T.Vector3(0,-1,0), box=new T.Box3(), sz=new T.Vector3(), wide={}; let cTop=null;
  [[0,0],[0.25,0.25],[-0.25,0.25],[0.25,-0.25],[-0.25,-0.25]].forEach(([u,v],si)=>{ const lx=u*it.w, ly=v*it.d, x=it.x+lx*c-ly*s, y=it.y+lx*s+ly*c; if(!inItem(o,x,y,0)) return;
    ray.set(new T.Vector3(x,ey+top+2,y),dn); ray.intersectObject(R3.items[o.id].m,true).forEach(h=>{ if(!h.face) return; const n=h.face.normal.clone().transformDirection(h.object.matrixWorld); if(n.y<0.7) return;
      /* นับเฉพาะแผ่นกว้าง (ชั้น โต๊ะ ที่นอน) ไม่นับหัวหนังสือหรือของชิ้นเล็กบนชั้น */
      const uid2=h.object.uuid; if(wide[uid2]==null){ box.setFromObject(h.object).getSize(sz); wide[uid2]=sz.x>=0.12&&sz.z>=0.12; } if(!wide[uid2]) return;
      const v2=rd(h.point.y-ey); if(v2<=(o.elev||0)+0.01) return; if(si===0&&(cTop==null||v2>cTop)) cTop=v2; if(!out.some(q=>Math.abs(q-v2)<0.05)) out.push(v2); }); });
  const lv=out.length?out.sort((p,q)=>p-q):[top]; lv.center=cTop!=null?lv.reduce((b,q)=>Math.abs(q-cTop)<Math.abs(b-cTop)?q:b,lv[0]):lv[lv.length-1];

  if(/INPUT|TEXTAREA|SELECT/.test(tag)){ if(e.key==='Escape') tg.blur(); return; }
  if(!$('panoBox').hidden){ if(e.key==='Escape') closePano(); return; }
  if(UI.home){ if(e.key==='Escape') hideHome(); return; }
  const k=e.key.toLowerCase(), mod=e.ctrlKey||e.metaKey;
  if(WK.on&&UI.view!=='2d'&&['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(k)&&!mod){ WK.keys[k]=true; e.preventDefault(); return; }
  if(mod&&k==='z'){ e.preventDefault(); e.shiftKey?redo():undo(); return; }
  if(mod&&k==='y'){ e.preventDefault(); redo(); return; }
  if(mod&&k==='d'){ e.preventDefault(); dupSel(); return; }
  if(mod&&k==='g'){ e.preventDefault(); act(e.shiftKey?'ungroup':'group'); return; }
  if(k.startsWith('arrow')&&SEL&&SEL.kind==='multi'){ const g={}; startMulti(g); if(g.type!=='multi') return; const st=e.shiftKey?0.1:0.01; moveMulti(g,k==='arrowleft'?-st:k==='arrowright'?st:0,k==='arrowup'?-st:k==='arrowdown'?st:0); e.preventDefault(); clearTimeout(nudgeT); nudgeT=setTimeout(commit,350); return; }
  if(k==='delete'||k==='backspace'){ if(isDraw()&&D.pts.length){ D.pts.pop(); updDrawBar(); need2=true; } else delSel(); e.preventDefault(); return; }
  if(k==='escape'){ if(UI.terra) setTerra(false); else if(TOOL!=='select') setTool('select'); else if(WK.on) setWalk(false); else select(null,true); return; }
  if(k==='enter'&&isDraw()){ finishDraw(); return; }

  if(k==='r'&&!mod&&SEL&&SEL.kind==='item'){ rotSel(e.shiftKey?-90:90); return; }
  if(k.startsWith('arrow')&&SEL&&SEL.kind==='item'){ const o=selObj(), st=e.shiftKey?0.1:0.01; if(k==='arrowleft') o.x=rd(o.x-st); if(k==='arrowright') o.x=rd(o.x+st); if(k==='arrowup') o.y=rd(o.y-st); if(k==='arrowdown') o.y=rd(o.y+st); e.preventDefault(); clearTimeout(nudgeT); live(); nudgeT=setTimeout(commit,350); }
});

function makePdf(pages){
  const enc=new TextEncoder(), chunks=[], offs=[]; let len=0;
  const push=d=>{ const b=typeof d==='string'?enc.encode(d):d; chunks.push(b); len+=b.length; };
  const obj=(id,fn)=>{ offs[id]=len; push(id+' 0 obj\n'); fn(); push('\nendobj\n'); };
  const W=842, H=595, n=pages.length, total=3+n*3;
  push('%PDF-1.4\n%âãÏÓ\n');
  obj(1,()=>push('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2,()=>push('<< /Type /Pages /Kids ['+pages.map((_,i)=>(3+i*3)+' 0 R').join(' ')+'] /Count '+n+' >>'));
  pages.forEach((pg,i)=>{ const pid=3+i*3, cs='q '+W+' 0 0 '+H+' 0 0 cm /Im'+i+' Do Q';
    obj(pid,()=>push('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+W+' '+H+'] /Resources << /XObject << /Im'+i+' '+(pid+2)+' 0 R >> >> /Contents '+(pid+1)+' 0 R >>'));
    obj(pid+1,()=>push('<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream'));
    obj(pid+2,()=>{ push('<< /Type /XObject /Subtype /Image /Width '+pg.w+' /Height '+pg.h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+pg.jpeg.length+' >>\nstream\n'); push(pg.jpeg); push('\nendstream'); });
  });
  const xref=len; push('xref\n0 '+total+'\n0000000000 65535 f \n');
  for(let i=1;i<total;i++) push(String(offs[i]).padStart(10,'0')+' 00000 n \n');
  push('trailer\n<< /Size '+total+' /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF\n');
  return new Blob(chunks,{type:'application/pdf'});
}

  clearTimeout(Store.lt); Store.lt=setTimeout(()=>{ const ok=saveLocal(); if(Store.mode==='cloud') return; setSave(ok?'local':'err'); if(!ok&&!Store.warned){ Store.warned=true; toast('เซฟในเครื่องไม่ได้ (เครื่องเต็ม หรือเปิดโหมดส่วนตัว) · กด "แปลนของฉัน" แล้วสำรองไฟล์ .json ไว้ก่อน'); } else if(ok) Store.warned=false; },300);
  if(Store.mode==='cloud'){ clearTimeout(Store.t); const id=P.id; Store.t=setTimeout(()=>cloudWrite(id),900); }
}
const packDoc=p=>({name:p.name,updated:p.updated,count:allOf(p,'items').length,rooms:allOf(p,'rooms').length,json:JSON.stringify(p)});
function unpack(id,d){ try{ const p=cleanProject(JSON.parse(d.json)); if(p) p.id=id; return p; }catch(e){ return null; } }
async function cloudWrite(id){
  const p=ALL[id]; if(!p||Store.mode!=='cloud') return;
  if(Store.busy[id]){ Store.again[id]=true; return; }
  Store.busy[id]=true;
  try{ await Store.col.doc(id).set(packDoc(p)); Store.retry=0; if(P&&id===P.id) setSave('cloud'); }
  catch(e){ const c=e&&e.code;
    if(c==='unavailable'&&Store.retry<1){ Store.retry++; setSave('retry'); setTimeout(()=>cloudWrite(id),1500+Math.random()*1500); }
    else if(c==='quota_exceeded'){ setSave('err'); toast('ที่เก็บเต็ม ลบแปลนเก่าที่ไม่ใช้ก่อน'); }
    else { setSave('err'); if(['invalid_argument','revoked','not_granted','capability_disabled','capability_removed'].includes(c)){ Store.mode='local'; setSave('local'); toast('บันทึกขึ้นบัญชีไม่ได้ เก็บไว้ในเครื่องนี้แทน'); } } }
  Store.busy[id]=false;
  if(Store.again[id]){ Store.again[id]=false; cloudWrite(id); }
}
/* เซฟเข้าบัญชีได้เฉพาะตอนเปิดผ่านลิงก์ Claude; เว็บ GitHub Pages กับไฟล์ในเครื่องเซฟในเบราว์เซอร์ของเครื่องนั้น */
async function initCloud(){
  if(!window.claude||!window.claude.use){ setSave('local'); return; }
  const [db,user]=await Promise.all([capP('db'),capP('user')]);
  if(!db||!user){ setSave('local'); return; }
  let id=null; try{ id=await user.id(); }catch(e){}
  if(!id){ setSave('local'); return; }
  let col; try{ col=db.collection('data/users/'+id); }catch(e){ setSave('local'); return; }
  await connectCloud(col);
}
async function connectCloud(col){
  let snap; try{ snap=await col.get(); }catch(e){ setSave('local'); return false; }
  Store.col=col; Store.mode='cloud';
  const cloud={}; snap.docs.forEach(d=>{ if(!d.exists) return; const p=unpack(d.id,d.data()); if(p) cloud[p.id]=p; });
  const hadCloud=Object.keys(cloud).length>0;
  if(hadCloud&&AUTO&&!cloud[AUTO]){ delete ALL[AUTO]; AUTO=null; }
  const push=[];
  new Set([...Object.keys(cloud),...Object.keys(ALL)]).forEach(k=>{ const a=ALL[k], c=cloud[k]; if(c&&(!a||c.updated>a.updated)) ALL[k]=c; else if(a&&(!c||a.updated>c.updated)) push.push(k); });
  AUTO=null; saveLocal();
  for(const k of push) await cloudWrite(k);
  if(!P||!ALL[P.id]) openProject(mostRecent());
  else if(ALL[P.id]!==P){ P=ALL[P.id]; openProject(P.id); }
  subscribeCurrent(); setSave('cloud'); if(UI.home) renderHome();
  return true;
}
function subscribeCurrent(){
  if(Store.unsub){ try{ Store.unsub(); }catch(e){} Store.unsub=null; }
  if(Store.mode!=='cloud'||!P) return; const id=P.id;
  try{ Store.unsub=Store.col.doc(id).onSnapshot(s=>{ if(!s.exists||s.metadata.hasPendingWrites||!P||P.id!==id) return; const d=s.data(); if(!(d.updated>P.updated+1)||P2.g||G3.g) return; const p=unpack(id,d); if(!p) return; ALL[id]=p; P=p; SEL=null; resetHistory(); refreshAfter(); renderPanel(); updateFab(); updProj(); renderFloorBar(); saveLocal(); if(UI.home) renderHome(); toast('อัปเดตจากอีกเครื่องแล้ว'); },()=>{}); }catch(e){}
}
async function cloudRefresh(){
  if(Store.mode!=='cloud') return false;
  try{ const s=await Store.col.get(); let ch=false; s.docs.forEach(d=>{ const x=d.data(), a=ALL[d.id]; if((!a||x.updated>a.updated)&&a!==P){ const p=unpack(d.id,x); if(p){ ALL[d.id]=p; ch=true; } } }); if(ch) saveLocal(); return ch; }catch(e){ return false; }
}
const mostRecent=()=>Object.keys(ALL).sort((a,b)=>ALL[b].updated-ALL[a].updated)[0];
function updProj(){ $('pName').textContent=P?P.name:''; }
function openProject(id){
  const p=ALL[id]; if(!p) return; P=p; SEL=null; clearFollow(); D.pts=[]; UI.arm=null; if(WK.on) setWalk(false); if(UI.terra) setTerra(false);
  WC=null; R3.key=null; resetHistory(); lsSet(LSL,id); refreshAfter(); renderPanel(); updateFab(); updProj(); renderFloorBar(); fit2d(); if(R3.ok&&W3>1) fit3d(); subscribeCurrent();
}
function addProject(p,msg){ ALL[p.id]=p; openProject(p.id); saveSoon(); hideHome(); if(msg) toast(msg); }
function putProject(p){ ALL[p.id]=p; saveLocal(); if(Store.mode==='cloud') cloudWrite(p.id); }
function deleteProject(id){
  delete ALL[id]; if(AUTO===id) AUTO=null; saveLocal(); bgDropPrefix(id+'/'); if(Store.mode==='cloud'){ Store.col.doc(id).delete().catch(()=>{}); }
  if(!Object.keys(ALL).length){ const p=starterProject(); ALL[p.id]=p; openProject(p.id); saveSoon(); } else if(P&&P.id===id) openProject(mostRecent());
}

/* ---------------- หน้าแปลนของฉัน: การ์ดละหนึ่งโปรเจกต์ ---------------- */
function fmtDate(t){ try{ const d=new Date(t); return d.toLocaleDateString('th-TH',{day:'numeric',month:'short'})+' '+d.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'}); }catch(e){ return ''; } }
const projArea=p=>allOf(p,'rooms').reduce((s,r)=>s+Math.abs(area2(r.pts))/2,0);
const fileName=p=>(p.name||'แปลน').replace(/[\\/:*?"<>|]+/g,' ').trim().slice(0,50)||'แปลน';
function cardHtml(id){
  const p=ALL[id], cur=P&&id===P.id, ren=UI.renaming===id, arm=UI.arm==='del:'+id;
  return `<article class="pcard${cur?' cur':''}" data-id="${id}">
    <button type="button" class="pthumb" data-h="open" aria-label="เปิด ${esc(p.name)}"><canvas data-pid="${id}" width="600" height="450"></canvas>${cur?'<span class="badge">เปิดอยู่</span>':''}</button>
    <div class="pbody">
      ${ren?`<input class="in-name" id="h-name" type="text" value="${esc(p.name)}" aria-label="ชื่อแปลน">`:`<div class="pc-name" title="${esc(p.name)}">${esc(p.name)}</div>`}
      <div class="pmeta">${p.floors.length>1?p.floors.length+' ชั้น · ':''}${allOf(p,'rooms').length} ห้อง · ${allOf(p,'items').length} ชิ้น · <span class="num">${f2(projArea(p))} ม²</span></div>
      <div class="pmeta">แก้ล่าสุด ${fmtDate(p.updated)}</div>
      <div class="pacts">
        <button type="button" class="btn sm pri" data-h="open">${cur?'แก้ต่อ':'เปิด'}</button>
        <span class="grow"></span>
        <button type="button" class="ib sm" data-h="rename" aria-label="เปลี่ยนชื่อ" title="เปลี่ยนชื่อ">${ic('edit',17)}</button>
        <button type="button" class="ib sm" data-h="dup" aria-label="ทำสำเนา" title="ทำสำเนา">${ic('dup',17)}</button>
        <button type="button" class="ib sm" data-h="export" aria-label="สำรองเป็นไฟล์" title="สำรองเป็นไฟล์ .json">${ic('save',17)}</button>
        <button type="button" class="ib sm danger${arm?' armed':''}" data-h="del" aria-label="ลบแปลนนี้" title="ลบแปลนนี้">${arm?'ยืนยันลบ':ic('trash',17)}</button>
      </div>
    </div>
  </article>`;
}
function drawProjThumb(cv,p){
  const x=cv.getContext('2d'), W=cv.width, H=cv.height; x.setTransform(1,0,0,1,0,0); x.fillStyle=TK.plan; x.fillRect(0,0,W,H);
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; const add=(a,b)=>{ x0=Math.min(x0,a); x1=Math.max(x1,a); y0=Math.min(y0,b); y1=Math.max(y1,b); };
  p.rooms.forEach(r=>r.pts.forEach(q=>{ add(q[0]-p.wallT,q[1]-p.wallT); add(q[0]+p.wallT,q[1]+p.wallT); }));
  p.items.forEach(it=>itemCorners(it).forEach(q=>add(q[0],q[1])));
  if(x0>x1){ x.fillStyle=TK.muted; x.font='500 26px "IBM Plex Sans Thai",sans-serif'; x.textAlign='center'; x.textBaseline='middle'; x.fillText('ยังไม่มีห้อง',W/2,H/2); return true; }
  const s=Math.min((W-70)/(x1-x0),(H-70)/(y1-y0)), ox=W/2-(x0+x1)/2*s, oy=H/2-(y0+y1)/2*s, X=v=>ox+v*s, Y=v=>oy+v*s;
  x.strokeStyle=TK.grid; x.lineWidth=1; x.beginPath();
  for(let i=Math.floor(-ox/s);i<=(W-ox)/s;i++){ x.moveTo(Math.round(X(i))+0.5,0); x.lineTo(Math.round(X(i))+0.5,H); }
  for(let i=Math.floor(-oy/s);i<=(H-oy)/s;i++){ x.moveTo(0,Math.round(Y(i))+0.5); x.lineTo(W,Math.round(Y(i))+0.5); } x.stroke();
  const poly=pts=>{ x.beginPath(); pts.forEach((q,i)=>i?x.lineTo(X(q[0]),Y(q[1])):x.moveTo(X(q[0]),Y(q[1]))); x.closePath(); };
  p.rooms.forEach(r=>{ poly(r.pts); x.globalAlpha=0.6; x.fillStyle=r.floorColor; x.fill(); x.globalAlpha=1; });
  let ready=true;
  p.items.slice().sort((a,b)=>(isFlat(b)-isFlat(a))||((a.elev||0)-(b.elev||0))).forEach(it=>{
    const th=thumb(it.type,it.color), w=it.w*s, d=it.d*s; if(!th&&R3.ok) ready=false;
    x.save(); x.translate(X(it.x),Y(it.y)); x.rotate(it.rot*Math.PI/180);
    if(th) x.drawImage(th,-w/2,-d/2,w,d); else { x.fillStyle=it.color||'#b9b2a5'; x.fillRect(-w/2,-d/2,w,d); }
    x.strokeStyle=TK.itemLine; x.lineWidth=1; x.strokeRect(-w/2,-d/2,w,d); x.restore();
  });
  x.strokeStyle=TK.wall; x.lineJoin='miter'; x.lineWidth=Math.max(3,p.wallT*s); p.rooms.forEach(r=>{ poly(r.pts); x.stroke(); });
  return ready;
}
function drawHomeThumbs(){ document.querySelectorAll('#pgrid canvas[data-pid]').forEach(cv=>{ if(cv.dataset.done) return; const p=ALL[cv.dataset.pid]; if(p&&drawProjThumb(cv,p)) cv.dataset.done='1'; }); }
function renderHome(){
  const ids=Object.keys(ALL).sort((a,b)=>ALL[b].updated-ALL[a].updated);
  $('pgrid').innerHTML=ids.map(cardHtml).join('');
  $('hCount').textContent=ids.length+' แปลน';
  $('hStore').textContent=Store.mode==='cloud'?'เซฟในบัญชี Claude เปิดจากคอมหรือมือถือก็เห็น':'เซฟในเบราว์เซอร์นี้ ถ้าจะย้ายเครื่องให้สำรองเป็นไฟล์';
  drawHomeThumbs();
  const inp=$('h-name'); if(inp){ inp.focus(); inp.select(); }
}
function showHome(){ blurField(); UI.home=true; UI.arm=null; UI.renaming=null; if(WK.on) setWalk(false); $('home').hidden=false; renderHome(); cloudRefresh().then(ch=>{ if(ch&&UI.home) renderHome(); }); }
function hideHome(){ UI.home=false; UI.renaming=null; UI.arm=null; $('home').hidden=true; requestAnimationFrame(()=>{ resizeAll(); fit2d(); if(R3.ok&&UI.view!=='2d') fit3d(); need2=true; need3=true; }); }

$('hBack').addEventListener('click',hideHome);
$('hNew').addEventListener('click',()=>addProject(starterProject(),'สร้างแปลนใหม่แล้ว'));
$('hTpl').addEventListener('click',()=>addProject(tplProject(),'เพิ่มแบบห้อง 1–2 แล้ว'));
$('hImport').addEventListener('click',()=>$('fileIn').click());
$('hCoop').addEventListener('click',()=>{ addProject(coopProject(),'เพิ่มเล้าไก่ตัวอย่างแล้ว แก้ขนาดหรือย้ายของได้ตามใจ'); setRoof(true); });
$('hMush').addEventListener('click',()=>{ addProject(mushroomProject(),'เพิ่มโรงเห็ดตัวอย่างแล้ว แก้ขนาดหรือย้ายของได้ตามใจ'); setRoof(true); });
$('home').addEventListener('click',e=>{
  const b=e.target.closest('[data-h]'); if(!b) return;
  const h=b.dataset.h, card=b.closest('.pcard'), id=card&&card.dataset.id, p=id&&ALL[id]; if(!p) return;
  if(h==='open'){ if(!P||id!==P.id) openProject(id); hideHome(); }
  else if(h==='rename'){ UI.renaming=id; UI.arm=null; renderHome(); }
  else if(h==='dup'){ const c=cleanProject(deep(p)); c.id=uid('p'); c.name=p.name+' (สำเนา)'; c.updated=Date.now(); putProject(c); renderHome(); toast('ทำสำเนา '+p.name+' แล้ว'); }
  else if(h==='export') saveFile(fileName(p)+'.json',JSON.stringify(p,null,1),'application/json');
  else if(h==='del'){
    if(UI.arm!=='del:'+id){ UI.arm='del:'+id; renderHome(); clearTimeout(armOnce.t); armOnce.t=setTimeout(()=>{ if(UI.arm==='del:'+id){ UI.arm=null; if(UI.home) renderHome(); } },3500); return; }
    UI.arm=null; deleteProject(id); renderHome(); toast('ลบ '+p.name+' แล้ว');
  }
});
$('home').addEventListener('keydown',e=>{ if(e.target.id!=='h-name') return; if(e.key==='Enter'){ e.preventDefault(); e.target.blur(); } else if(e.key==='Escape'){ e.preventDefault(); UI.renaming=null; renderHome(); } });
$('home').addEventListener('focusout',e=>{
  if(e.target.id!=='h-name'||!UI.renaming) return;
  const id=UI.renaming, p=ALL[id], t=e.target.value.trim().slice(0,80); UI.renaming=null;
  if(p&&t&&t!==p.name){ if(P&&id===P.id){ P.name=t; updProj(); commit(); } else { p.name=t; p.updated=Date.now(); putProject(p); } }
  const div=document.createElement('div'); div.className='pc-name'; div.textContent=p?p.name:t; e.target.replaceWith(div);
});
$('fileIn').addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0]; e.target.value=''; if(!f) return;
  const rdr=new FileReader(); rdr.onload=()=>{ let p=null; try{ p=cleanProject(JSON.parse(rdr.result)); }catch(err){} if(!p){ toast('ไฟล์นี้ไม่ใช่ไฟล์แปลนที่สำรองไว้'); return; } p.id=uid('p'); addProject(p,'เปิดไฟล์ '+p.name+' แล้ว'); }; rdr.readAsText(f);
});

let toastT=null;
function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('on'),2600); }
function onTheme(){ readTokens(); theme3d(); need2=true; if(UI.home) renderHome(); }
try{ window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',onTheme); }catch(e){}
try{ new MutationObserver(onTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']}); }catch(e){}
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{ need2=true; });
let lastT=performance.now();
function loop(t){
  requestAnimationFrame(loop); const dt=Math.min(0.05,Math.max(0,(t-lastT)/1000)); lastT=t;
  if(!UI.home){
    if(R3.ok&&UI.view!=='2d'){ if(WK.on&&stepWalk(dt)) need3=true; if(R3.spin&&!document.hidden) R3.spin.forEach(o=>{ const s=o.userData.spin; if(s.roof&&!R3.roof.visible) return; o.rotation[s.ax]+=s.v*dt; need3=true; }); if(need3){ need3=false; updateWallCut(); R3.renderer.render(R3.scene,R3.cam); } }
    if(need2&&UI.view!=='3d') draw2d();

}
