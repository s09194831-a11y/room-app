<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#e6eae6"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style></head><body><title>ลองจัดห้อง</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* Layout: แถบบน · เครื่องมือซ้าย · เวทีแปลน 2D / ภาพ 3D ตรงกลาง · แผงขวา
   มือถือ: เวทีเต็มกว้าง แผงเป็นชีตย่อ/ขยายได้ เครื่องมืออยู่แถวล่างสุด
   สี: กระดาษเขียนแบบเทาอมเขียว หมึกน้ำเงินเข้ม ปากกาเน้นสีเขียวหัวเป็ด */
:root{
  --bg:#e6eae6; --surface:#f8f9f6; --plan:#f2f4f0; --ink:#1d282d; --muted:#5b686d; --line:#d0d8d3;
  --wall:#26313a; --accent:#0d7a72; --accent-ink:#ffffff; --accent-soft:rgba(13,122,114,.12);
  --warn:#c13d29; --warn-soft:rgba(193,61,41,.14); --grid:rgba(29,40,45,.055); --grid-major:rgba(29,40,45,.12);
  --item-line:rgba(29,40,45,.42); --scene:#dce1db; --ground:#c9d0c6; --scrim:rgba(12,18,20,.48);
  --shadow:0 1px 2px rgba(12,18,20,.08),0 4px 14px rgba(12,18,20,.08);
  --font-display:"Bai Jamjuree","IBM Plex Sans Thai","Leelawadee UI",system-ui,sans-serif;
  --font-body:"IBM Plex Sans Thai","Noto Sans Thai","Leelawadee UI",system-ui,sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1518; --surface:#172024; --plan:#131b1e; --ink:#dce5e7; --muted:#8f9ca1; --line:#29353a;
    --wall:#c3cfd3; --accent:#3dbcb0; --accent-ink:#082022; --accent-soft:rgba(61,188,176,.16);
    --warn:#ff7d66; --warn-soft:rgba(255,125,102,.2); --grid:rgba(220,229,231,.045); --grid-major:rgba(220,229,231,.1);
    --item-line:rgba(220,229,231,.4); --scene:#1a2327; --ground:#20292d; --scrim:rgba(0,0,0,.6);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.3); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1518; --surface:#172024; --plan:#131b1e; --ink:#dce5e7; --muted:#8f9ca1; --line:#29353a;
  --wall:#c3cfd3; --accent:#3dbcb0; --accent-ink:#082022; --accent-soft:rgba(61,188,176,.16);
  --warn:#ff7d66; --warn-soft:rgba(255,125,102,.2); --grid:rgba(220,229,231,.045); --grid-major:rgba(220,229,231,.1);
  --item-line:rgba(220,229,231,.4); --scene:#1a2327; --ground:#20292d; --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.3); color-scheme:dark;
}
html{height:100%;box-sizing:border-box;-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}
@supports (height:100dvh){html{height:100dvh}}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
.app,.home{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
@media (pointer:coarse){input{font-size:16px!important}}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--font-body);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:grid;grid-template-columns:74px minmax(0,1fr) 330px;grid-template-rows:auto minmax(0,1fr);grid-template-areas:"bar bar bar" "tools stage side";gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{grid-area:bar;display:flex;align-items:center;gap:8px;min-width:0}
.brand{display:flex;align-items:center;gap:8px;font:600 18px/1 var(--font-display);letter-spacing:.01em;white-space:nowrap;padding-right:4px}
.brand svg{color:var(--accent)}
.myplans{display:inline-flex;align-items:center;gap:7px;flex:none;height:36px;padding:0 13px;border:1.5px solid var(--accent);border-radius:9px;background:var(--accent-soft);color:var(--accent);font:600 14px var(--font-display);white-space:nowrap}
.myplans:hover{background:var(--accent);color:var(--accent-ink)}
.curp{display:flex;align-items:center;gap:8px;min-width:0;max-width:340px;padding:0 4px}
.pname{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.pstate{font-size:12px;color:var(--muted);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot[data-s="cloud"]{background:var(--accent)}
.dot[data-s="err"]{background:var(--warn)}
.dot[data-s="saving"]{animation:pulse 1s infinite}
.grow{flex:1}
.ib{width:36px;height:36px;flex:none;display:inline-grid;place-items:center;border:1px solid var(--line);border-radius:9px;background:var(--surface)}
.ib.lb{width:auto;display:inline-flex;align-items:center;gap:6px;padding:0 11px;font-size:13px;font-weight:500}
.seg{display:inline-flex;flex:none;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:2px;gap:2px}
.seg button{height:30px;padding:0 11px;border-radius:7px;font:600 13px var(--font-display);color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.tools{grid-area:tools;display:flex;flex-direction:column;gap:6px}
.tool{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 7px;border-radius:10px;color:var(--muted);font-size:11.5px;line-height:1.2;text-align:center}
.tool:hover{background:var(--surface)}
.tool[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.stage{grid-area:stage;position:relative;display:grid;grid-template-columns:minmax(0,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--plan);min-height:0;min-width:0}
.stage[data-view="split"]{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.stage[data-view="2d"] .p3d,.stage[data-view="3d"] .p2d{display:none}
.stage[data-view="split"] .p3d{border-left:1px solid var(--line)}
.pane{position:relative;min-width:0;min-height:0;overflow:hidden}
.pane canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.p3d{background:var(--scene)}
.ov{position:absolute;top:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100% - 20px)}
.ovb{height:34px;min-width:34px;padding:0 8px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);border-radius:9px;background:var(--surface);box-shadow:var(--shadow);font-size:12.5px;white-space:nowrap}
.ovb[aria-pressed="true"]{color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent),var(--shadow)}
.hint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);width:max-content;max-width:calc(100% - 24px);background:var(--ink);color:var(--surface);padding:7px 12px;border-radius:9px;font-size:13px;box-shadow:var(--shadow);text-align:center}
.drawbar{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);width:max-content;max-width:calc(100% - 24px);display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 8px;padding:8px 10px;background:var(--surface);border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow);font-size:13px}
.drawbar .dlen{display:flex;align-items:center;gap:6px;color:var(--muted)}
.drawbar input{width:84px;height:30px;padding:0 8px;border:1px solid var(--line);border-radius:7px;background:var(--plan);color:var(--ink);font:500 13px var(--font-num)}
.scalebar{position:absolute;left:12px;bottom:12px;display:flex;flex-direction:column;gap:3px;font:500 11px var(--font-num);color:var(--muted);pointer-events:none}
.scalebar i{display:block;height:6px;border:1.5px solid var(--muted);border-top:0}
.floorbar{position:absolute;top:10px;left:10px;z-index:3;display:flex;gap:2px;padding:3px;max-width:calc(50% - 20px);overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface);box-shadow:var(--shadow);scrollbar-width:none}
.floorbar button{flex:none;height:30px;padding:0 11px;border-radius:7px;font:600 13px var(--font-display);color:var(--muted);white-space:nowrap}
.floorbar button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.floorbar .fadd{color:var(--accent);padding:0 9px}
.stage[data-view="3d"] .floorbar,.stage[data-view="2d"] .floorbar{max-width:calc(100% - 70px)}
.stage[data-view="3d"] .floorbar{top:auto;bottom:12px}
.stage[data-view="3d"] .fab{top:10px}
.fab{position:absolute;top:56px;left:10px;display:flex;flex-wrap:wrap;gap:2px;padding:4px;max-width:calc(100% - 20px);border:1px solid var(--line);border-radius:11px;background:var(--surface);box-shadow:var(--shadow);z-index:2}
.fab button{height:34px;padding:0 9px;display:inline-flex;align-items:center;gap:6px;border-radius:8px;font-size:12.5px;white-space:nowrap}
.fab button:hover{background:var(--accent-soft)}
.fab .danger{color:var(--warn)}
@media (max-width:599px){.fab .fl,.ovb span,.ib.lb span,#redoBtn,.brand,.curp{display:none}.myplans{padding:0 10px;font-size:13.5px}.seg button{padding:0 9px}.fab button{padding:0 10px}.ib.lb{width:36px;padding:0;justify-content:center}.ov{flex-direction:column}.bar{gap:6px}}
@media (max-width:359px){.myplans span{display:none}.myplans{width:36px;padding:0;justify-content:center}.bar{gap:4px}.seg button{padding:0 7px}}
.joy{position:absolute;left:16px;bottom:16px;width:116px;height:116px;border-radius:50%;background:var(--surface);opacity:.9;border:1px solid var(--line);box-shadow:var(--shadow);touch-action:none}
.knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:var(--accent);pointer-events:none}
.hint3{position:absolute;right:12px;bottom:12px;max-width:calc(100% - 160px);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:6px 10px;font-size:12.5px;color:var(--muted);box-shadow:var(--shadow)}
.no3d{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted)}
.side{grid-area:side;display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tabs{display:flex;align-items:stretch;border-bottom:1px solid var(--line);flex:none}
.tab{flex:1;min-width:0;padding:11px 6px 9px;font:600 13.5px var(--font-display);color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.sheetTog{display:none;width:44px;flex:none;place-items:center;color:var(--muted)}
.side[data-open="0"] .sheetTog svg{transform:rotate(180deg)}
.sbody{flex:1;min-height:0;overflow:auto;padding:12px 14px 16px;overscroll-behavior:contain}
.sbody h3{margin:16px 0 7px;font:600 12.5px var(--font-display);color:var(--muted);letter-spacing:.02em}
.sbody h3:first-child{margin-top:2px}
.f3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
.f input,.in-name,.search input{width:100%;height:36px;padding:0 9px;border:1px solid var(--line);border-radius:8px;background:var(--plan);color:var(--ink);font:500 14px var(--font-num)}
.in-name,.search input{font:500 14.5px var(--font-body)}
.in-name{font-weight:600}
.btnrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.btn{min-height:34px;padding:0 11px;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:13px}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--warn)}
.btn.armed{background:var(--warn);border-color:var(--warn);color:var(--surface)}
.btn.sm{min-height:28px;padding:0 9px;font-size:12px}
.sep{padding-top:12px;margin-top:14px;border-top:1px solid var(--line)}
.sw{display:flex;flex-wrap:wrap;gap:7px}
.sw button{width:28px;height:28px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.14),0 0 0 1px var(--line)}
.sw button[aria-pressed="true"]{box-shadow:inset 0 0 0 1px rgba(0,0,0,.14),0 0 0 2px var(--surface),0 0 0 4px var(--accent)}
.sw .def{width:auto;padding:0 9px;border-radius:999px;background:var(--plan);font-size:11.5px;color:var(--muted)}
.status{margin-top:8px;padding:7px 10px;border-radius:8px;font-size:13px}
.status.ok{background:var(--accent-soft);color:var(--accent)}
.status.bad{background:var(--warn-soft);color:var(--warn)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin-top:10px;font-size:13px}
.kv b{font:500 14px var(--font-num);text-align:right}
.walls{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.walls li{display:flex;align-items:center;gap:8px;padding:3px 4px 3px 4px;border-radius:8px;background:var(--plan)}
.walls li.on{box-shadow:inset 0 0 0 1.5px var(--accent)}
.walls .wl{flex:1;display:flex;justify-content:space-between;gap:8px;padding:4px 6px;text-align:left;font-size:13px;border-radius:6px}
.walls b{font:500 13px var(--font-num)}
.seg.sm button{height:28px;font-size:12.5px}
.search{margin-top:2px}
.cats{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;margin-top:10px;scrollbar-width:thin}
.chip{flex:none;height:30px;padding:0 11px;border:1px solid var(--line);border-radius:999px;font-size:12.5px;white-space:nowrap;background:var(--surface)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(94px,1fr));gap:8px;margin-top:8px}
.card{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 5px 7px;border:1px solid var(--line);border-radius:10px;background:var(--plan);min-width:0}
.card:hover{border-color:var(--accent)}
.card canvas{width:76px;height:58px}
.card .nm{font-size:12px;line-height:1.25;text-align:center;overflow-wrap:anywhere}
.card .dm{font:500 10.5px var(--font-num);color:var(--muted)}
.rooms{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.flrow{display:flex;align-items:center;gap:6px}
.flrow .in-name{flex:1;min-width:0;height:32px;font-size:14px}
.rooms button{width:100%;display:flex;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:8px;background:var(--plan);text-align:left}
.num{font-family:var(--font-num);font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.chk{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13.5px}
.help{margin:0;padding-left:18px;color:var(--muted);font-size:13px;display:flex;flex-direction:column;gap:3px}
.muted{color:var(--muted)}
.small{font-size:12px}
.empty{color:var(--muted);font-size:13.5px;padding:6px 0 2px}
.ttl{font:600 16px var(--font-display)}
.home{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.hbar{display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--surface)}
.hbrand{display:flex;align-items:center;gap:8px;font:600 18px/1 var(--font-display);white-space:nowrap}
.hbrand svg{color:var(--accent)}
.hscroll{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain}
.hwrap{max-width:1200px;margin:0 auto;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hhead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
.hhead h1{margin:0;font:600 30px/1.15 var(--font-display);text-wrap:balance}
.hhead p{margin:6px 0 0;font-size:13.5px;max-width:62ch}
.hhead .btnrow{margin-top:0}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin-top:22px}
.pcard{display:flex;flex-direction:column;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pcard.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.pthumb{position:relative;display:block;width:100%;max-width:100%;aspect-ratio:4/3;background:var(--plan);border-bottom:1px solid var(--line)}
.pthumb canvas{display:block;width:100%;height:100%}
.pthumb:hover{filter:brightness(1.02)}
.badge{position:absolute;top:10px;left:10px;padding:3px 10px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:600}
.pbody{display:flex;flex-direction:column;gap:3px;padding:12px;min-width:0}
.pc-name{font:600 16.5px/1.3 var(--font-display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbody .in-name{height:32px;font-size:15px}
.pmeta{font-size:12.5px;color:var(--muted)}
.pacts{display:flex;align-items:center;gap:6px;margin-top:9px}
.ib.sm{width:34px;height:34px}
.ib.danger{color:var(--warn)}
.ib.armed{width:auto;padding:0 10px;background:var(--warn);border-color:var(--warn);color:var(--surface);font-size:12.5px;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(10px);opacity:0;pointer-events:none;background:var(--ink);color:var(--surface);padding:8px 14px;border-radius:9px;font-size:13.5px;box-shadow:var(--shadow);transition:opacity .2s,transform .2s;z-index:60;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.toast{transition:none}.dot[data-s="saving"]{animation:none}}
@media (max-width:899px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto auto;grid-template-areas:"bar" "stage" "side" "tools";gap:8px;padding-block:8px}
  .brand .bname,.pstate,.seg .wide{display:none}
  .brand{padding-right:0}
  .tools{flex-direction:row;gap:2px}
  .tool{flex:1;min-width:0;padding:6px 1px 5px;font-size:10.5px}
  .sheetTog{display:grid}
  .side[data-open="0"] .sbody{display:none}
  .side[data-open="0"]{border-radius:12px}
  .sbody{max-height:min(42vh,420px);max-height:min(42dvh,420px)}
  .hint3{display:none}
}
</style>

<div class="app" id="app">
  <header class="bar">
    <div class="brand"><span data-ic="logo" data-is="22"></span><span class="bname">ลองจัดห้อง</span></div>
    <button class="myplans" id="projBtn" type="button" title="ไปหน้าแปลนของฉัน" data-ic="grid" data-is="18"><span>แปลนของฉัน</span></button>
    <div class="curp"><span class="dot" id="saveDot"></span><span class="pname" id="pName">แปลนห้อง</span><span class="pstate" id="saveTxt"></span></div>

    if(isElec(it)) return;

    if(!isFlat(it)&&holes.some(h=>overlapItems(it,h))) list.push('ทับช่องบันได');

function drawWires(){

    c.strokeStyle=on?TK.accent:TK.surface; c.lineWidth=on?7:5; c.stroke();
    c.strokeStyle=col; c.lineWidth=on?3:2.2; c.setLineDash(wr.c==='light'?[9,5]:wr.c==='other'?[2,5]:[]); c.stroke(); c.setLineDash([]);
    wr.pts.forEach((q,i)=>{ const Q=w2s(q[0],q[1]); c.beginPath(); c.arc(Q[0],Q[1],on?6:3,0,Math.PI*2); c.fillStyle=on?(sel.i===i?TK.accent:TK.surface):col; c.fill(); if(on){ c.strokeStyle=TK.accent; c.lineWidth=2; c.stroke(); } });
    if(on) for(let i=1;i<wr.pts.length;i++){ const a=wr.pts[i-1], b=wr.pts[i], L=Math.hypot(b[0]-a[0],b[1]-a[1]); if(L*V2.s<44) continue; const M=w2s((a[0]+b[0])/2,(a[1]+b[1])/2); pill(String(cm(L)),M[0],M[1]-13,TK.accent,TK.accentInk); }

/* สัญลักษณ์บนแปลน: ไฟ = วงกลมกากบาท · ปลั๊ก = สองขีด · สวิตช์ = S · ตู้ไฟ = กล่องสายฟ้า */
function elecSym(X,Y,k){
  const c=g2, col={plug:'#d6453d',switch:'#3f6fb5',light:'#e0a100',panel:'#2b2d31',other:'#6b7280'}[k]||'#6b7280';
  c.save(); c.fillStyle='#ffffff'; c.strokeStyle=col; c.lineWidth=2; c.beginPath(); if(k==='panel') c.rect(X-8,Y-8,16,16); else c.arc(X,Y,8,0,Math.PI*2); c.fill(); c.stroke(); c.lineWidth=1.7; c.beginPath();
  if(k==='light'){ c.moveTo(X-5,Y-5); c.lineTo(X+5,Y+5); c.moveTo(X+5,Y-5); c.lineTo(X-5,Y+5); c.stroke(); }
  else if(k==='plug'){ c.moveTo(X-2.5,Y-4); c.lineTo(X-2.5,Y+4); c.moveTo(X+2.5,Y-4); c.lineTo(X+2.5,Y+4); c.stroke(); }
  else if(k==='panel'){ c.fillStyle=col; c.moveTo(X+1,Y-6); c.lineTo(X-4,Y+1); c.lineTo(X,Y+1); c.lineTo(X-1,Y+6); c.lineTo(X+4,Y-1); c.lineTo(X,Y-1); c.closePath(); c.fill(); }
  else { c.fillStyle=col; c.font='700 10px "Bai Jamjuree",sans-serif'; c.textAlign='center'; c.textBaseline='middle'; c.fillText(k==='switch'?'S':'F',X,Y+0.5); }
  c.restore();
}

function drawAdd(w){

  if(last&&Math.abs(last[0]-p[0])<1e-6&&Math.abs(last[1]-p[1])<1e-6) return;
  D.pts.push(p); D.hover=null; D.guides=[]; updDrawBar(); need2=true;
}
function drawTyped(){
  const inp=$('dbLen'), L=parseFloat(inp.value)/100; if(!(L>0)) return;

  let a=Math.atan2(dy,dx); const a90=Math.round(a/(Math.PI/2))*(Math.PI/2); if(Math.abs(a-a90)<0.2) a=a90;

function finishDraw(){

  const [type,color]=k.split('|'); const c=C[type]; if(!c) return;
  const mx=Math.max(c.w,c.d), px=256/mx, W=Math.max(8,Math.round(c.w*px)), H=Math.max(8,Math.round(c.d*px));
  const g=new T.Group(); c.make(g,{type,color:color||undefined}); R3.tScene.add(g);
  const cam=R3.tCam; cam.left=-c.w/2; cam.right=c.w/2; cam.top=c.d/2; cam.bottom=-c.d/2; cam.near=0.01; cam.far=c.h+4; cam.position.set(0,c.h+2,0); cam.up.set(0,0,-1); cam.lookAt(0,0,0); cam.updateProjectionMatrix();

  R3.tScene.remove(g); disposeTree(g);

}

function renderPanel(){

  if(UI.tab==='add') drawCardThumbs();
}
function refreshStatus(){
  const o=selObj(); if(!o||UI.tab!=='edit') return;
  if(SEL.kind==='item'){ const el=$('e-status'); if(el){ el.className='status '+(PROB[o.id]?'bad':'ok'); el.innerHTML=statusHtml(o); } }
  if(SEL.kind==='room'){ const st=STATS[o.id]; if(st&&$('r-area')){ $('r-area').textContent=f2(st.area)+' ม²'; $('r-free').textContent=f2(st.free)+' ม²'; } }
}
function setTab(t,open){ UI.tab=t; if(open) setSheet(true); renderPanel(); }
function setSheet(open){ UI.open=open; $('side').dataset.open=open?'1':'0'; requestAnimationFrame(resizeAll); }
function select(s,keepTab){
  SEL=s; UI.arm=null;
  if(s&&!keepTab&&UI.tab!=='edit') UI.tab='edit';
  renderPanel(); updateFab(); need2=true; if(R3.ok){ syncItems3d(); syncShapes3d(); syncWires3d(); need3=true; }
}
function updateFab(){
  const f=$('fab'), o=selObj(); if(!o){ f.hidden=true; return; }
  let h='';
  const B=(a,i,t,cls)=>`<button type="button" data-act="${a}"${cls?` class="${cls}"`:''} aria-label="${t}" title="${t}">${ic(i,18)}<span class="fl">${t}</span></button>`;
  if(WK.on){ f.hidden=true; return; }
  if(SEL.kind==='item') h=B('rotR','rotr','หมุน')+B('dup','dup','ทำซ้ำ')+B('del','trash','ลบ','danger')+B('openEdit','edit','แก้ไข');
  else if(SEL.kind==='open') h=(o.kind==='door'?B('flipOut','flip','กลับทางเปิด'):'')+B('del','trash','ลบ','danger')+B('openEdit','edit','แก้ไข');
  else if(SEL.kind==='shape') h=B('rotR','rotr','หมุน')+B('dup','dup','ทำซ้ำ')+B('del','trash','ลบ','danger')+B('openEdit','edit','แก้ไข');
  else if(SEL.kind==='wire') h=B('del','trash','ลบ','danger')+B('openEdit','edit','แก้ไข');
  else h=B('openEdit','edit','แก้ขนาด สี ผนัง');
  f.innerHTML=h; f.hidden=false;
}

/* ---------------- คำสั่งจากปุ่ม ---------------- */
function addItem(type){
  const c=C[type]; const it={id:uid('i'),type,x:0,y:0,rot:0,w:c.w,d:c.d,h:c.h,elev:c.ceil?rd(P.wallH-c.h):(c.elev||0)};
  let cx, cy; if(UI.view==='3d'&&R3.ok){ cx=CAM.tx; cy=CAM.tz; } else { const w=s2w(W2/2,H2/2); cx=w[0]; cy=w[1]; }
  const dist=r=>{ const lp=labelPoint(r.pts); return Math.hypot(lp[0]-cx,lp[1]-cy); };
  const tries=[roomAt(cx,cy),SEL&&SEL.kind==='room'?getRoom(SEL.id):null,...P.rooms.slice().sort((a,b)=>dist(a)-dist(b))].filter((r,i,a)=>r&&a.indexOf(r)===i);
  if(!tries.some(r=>findSpot(it,r,cx,cy))){ it.x=rd(cx); it.y=rd(cy); }
  P.items.push(it); select({kind:'item',id:it.id},true); commit(); toast('วาง '+c.name+' แล้ว ลากไปที่ที่ต้องการได้');
}
function placeOk(it,room){ if(itemCorners(it,0.006).some(q=>!pip(q[0],q[1],room.pts))) return false; if(doorSectors().some(s=>sectorHits(s,it))) return false; return !P.items.some(o=>o!==it&&!ignorePair(it,o)&&overlapItems(it,o)); }
function findSpot(it,room,cx,cy){
  const e=ext(it), b=bboxPts(room.pts), cands=[];
  for(let y=b.y0+e[1]/2+0.02;y<=b.y1-e[1]/2-0.02+1e-6;y+=0.1) for(let x=b.x0+e[0]/2+0.02;x<=b.x1-e[0]/2-0.02+1e-6;x+=0.1) cands.push([x,y]);
  if(!pip(cx,cy,room.pts)){ const lp=labelPoint(room.pts); cx=lp[0]; cy=lp[1]; }
  cands.sort((a,c)=>Math.hypot(a[0]-cx,a[1]-cy)-Math.hypot(c[0]-cx,c[1]-cy));
  for(const q of cands){ it.x=rd(q[0]); it.y=rd(q[1]); if(placeOk(it,room)){ snapItem(it); return true; } }
  it.x=rd(cx); it.y=rd(cy); return false;
}
function delSel(){
  const o=selObj(); if(!o) return;
  if(SEL.kind==='item') P.items=P.items.filter(x=>x!==o);
  else if(SEL.kind==='open') P.openings=P.openings.filter(x=>x!==o);
  else if(SEL.kind==='shape') P.shapes=P.shapes.filter(x=>x!==o);
  else if(SEL.kind==='wire') P.wires=P.wires.filter(x=>x!==o);
  else return;
  select(null,true); commit();
}
function dupSel(){
  const o=selObj(); if(!o) return;
  if(SEL.kind==='item'){ const c=deep(o); c.id=uid('i'); c.x=rd(o.x+0.15); c.y=rd(o.y+0.15); P.items.push(c); select({kind:'item',id:c.id},true); commit(); }
  else if(SEL.kind==='room') act('dupRoom',{dataset:{}});
  else if(SEL.kind==='shape'){ const c=deep(o); c.id=uid('s'); c.name=o.name+' (สำเนา)'; c.pts=o.pts.map(q=>[rd(q[0]+0.2),rd(q[1]+0.2)]); P.shapes.push(c); select({kind:'shape',id:c.id},true); commit(); }
  else if(SEL.kind==='wire'){ const c=deep(o); c.id=uid('w'); c.pts=o.pts.map(q=>[rd(q[0]+0.2),rd(q[1]+0.2)]); P.wires.push(c); select({kind:'wire',id:c.id},true); commit(); }
}
function rotSel(d){
  const o=selObj(); if(!o) return;
  if(SEL.kind==='shape'){ const b=bboxPts(o.pts), cx=(b.x0+b.x1)/2, cy=(b.y0+b.y1)/2, sg=d>0?1:-1; o.pts=o.pts.map(q=>[rd(cx-sg*(q[1]-cy)),rd(cy+sg*(q[0]-cx))]); commit(); return; }
  if(SEL.kind!=='item') return; o.rot=((o.rot+d)%360+360)%360; commit();
}
function armOnce(kind,el,label){ if(UI.arm===kind) return true; UI.arm=kind; if(el&&el.classList){ el.classList.add('armed'); el.lastChild.textContent=label; } clearTimeout(armOnce.t); armOnce.t=setTimeout(()=>{ if(UI.arm===kind){ UI.arm=null; if(UI.tab==='edit') renderPanel(); } },3500); return false; }
function act(a,el){
  const o=selObj(), v=el&&el.dataset?el.dataset.v:undefined;
  switch(a){
    case 'cat': UI.cat=v; UI.q=''; renderPanel(); break;
    case 'add': addItem(v); break;
    case 'rotR': rotSel(90); break;
    case 'rotL': rotSel(-90); break;
    case 'dup': dupSel(); break;
    case 'del': delSel(); break;
    case 'openEdit': setTab('edit',true); break;
    case 'size0': if(o&&SEL.kind==='item'){ const c=C[o.type]; o.w=c.w; o.d=c.d; o.h=c.h; o.elev=c.ceil?rd(P.wallH-c.h):(c.elev||0); commit(); } break;
    case 'icol': if(o&&SEL.kind==='item'){ if(v) o.color=v; else delete o.color; commit(); } break;
    case 'scol': if(o&&SEL.kind==='shape'){ o.color=v; commit(); } break;
    case 'smat': if(o&&SEL.kind==='shape'){ o.mat=v; if(v==='wood'&&!['#b58a5f','#7a5236'].includes(o.color)) o.color='#b58a5f'; if(v==='glass'&&!['#3f6fb5','#2f7d6b','#f3f1ec'].includes(o.color)) o.color='#8fc3e0'; commit(); } break;
    case 'pickWall': if(o&&SEL.kind==='room'){ SEL.wall=+v; SEL.corner=null; renderPanel(); need2=true; } break;
    case 'split': if(o&&SEL.kind==='room'){ const i=+v, n=o.pts.length, list=openingCenters(o), a2=o.pts[i], b2=o.pts[(i+1)%n]; o.pts.splice(i+1,0,[rd((a2[0]+b2[0])/2),rd((a2[1]+b2[1])/2)]); reattach(o,list); SEL.corner=i+1; SEL.wall=null; commit(); toast('เพิ่มมุมกลางผนังแล้ว ลากมุมนั้นเพื่อทำห้องตัว L'); } break;
    case 'delCorner': if(o&&SEL.kind==='room'&&o.pts.length>3&&SEL.corner!=null){ const list=openingCenters(o); o.pts.splice(SEL.corner,1); reattach(o,list); SEL.corner=null; commit(); } break;
    case 'floor': if(o&&SEL.kind==='room'){ o.floor=v; if(v==='grass'&&!['#6aa84f','#4f8a3a'].includes(o.floorColor)) o.floorColor='#6aa84f'; else if(v!=='grass'&&['#6aa84f','#4f8a3a'].includes(o.floorColor)) o.floorColor=FLOOR_COLORS[0]; commit(); } break;
    case 'fcol': if(o&&SEL.kind==='room'){ o.floorColor=v; commit(); } break;
    case 'wcol': if(o&&SEL.kind==='room'){ o.wallColor=v; commit(); } break;
    case 'dupRoom': if(o&&SEL.kind==='room'){ const b=bboxPts(P.rooms.flatMap(r=>r.pts)), rb=bboxPts(o.pts), dx=rd(b.x1+P.wallT-rb.x0); const r=deep(o); r.id=uid('r'); r.name=o.name+' (สำเนา)'; r.pts=o.pts.map(q=>[rd(q[0]+dx),q[1]]); P.rooms.push(r); P.openings.filter(x=>x.room===o.id).forEach(x=>{ const y=deep(x); y.id=uid('o'); y.room=r.id; P.openings.push(y); }); P.items.filter(it=>pip(it.x,it.y,o.pts)).forEach(it=>{ const y=deep(it); y.id=uid('i'); y.x=rd(it.x+dx); P.items.push(y); }); select({kind:'room',id:r.id}); commit(); fit2d(); } break;
    case 'delRoom': if(o&&SEL.kind==='room'){ if(!armOnce('room',el,'แตะอีกครั้งเพื่อลบห้องและของในห้อง')) break; UI.arm=null; P.items=P.items.filter(it=>!pip(it.x,it.y,o.pts)); P.openings=P.openings.filter(x=>x.room!==o.id); P.rooms=P.rooms.filter(r=>r!==o); select(null,true); commit(); toast('ลบห้องแล้ว กดย้อนกลับได้ถ้าเผลอลบ'); } break;
    case 'flipOut': if(o&&SEL.kind==='open'){ o.out=!o.out; commit(); updateFab(); } break;
    case 'flipHinge': if(o&&SEL.kind==='open'){ o.hinge=o.hinge?0:1; commit(); } break;
    case 'pickRoom': select({kind:'room',id:v}); break;
    case 'addRectRoom': { const b=P.rooms.length?bboxPts(P.rooms.flatMap(r=>r.pts)):{x1:-P.wallT,y0:0}; addRectRoom(b.x1+P.wallT,b.y0,3,3); fit2d(); break; }
    case 'fit': fit2d(); if(R3.ok) fit3d(); break;
    case 'gofloor': setFloor(+v); renderPanel(); break;
    case 'addfloor': addFloor(); break;
    case 'delfloor': if(UI.arm!=='floor:'+v){ UI.arm='floor:'+v; renderPanel(); clearTimeout(armOnce.t); armOnce.t=setTimeout(()=>{ if(UI.arm==='floor:'+v){ UI.arm=null; renderPanel(); } },3500); break; } UI.arm=null; deleteFloor(+v); break;
    case 'rcol': roofOf(P).color=v; commit(); setRoof(true); break;
    case 'rpitch': roofOf(P).pitch=+v; commit(); setRoof(true); break;
    case 'rmat': { const rf=roofOf(P); if(rf.mat!==v){ rf.mat=v; rf.color=ROOF_MAT_COLOR[v]||rf.color; } commit(); setRoof(true); break; }
    case 'wtype': if(o&&SEL.kind==='room'){ o.wallType=v; commit(); if(R3.ok&&v==='mesh'&&UI.view==='2d') toast('ดูผนังตาข่ายได้ในภาพ 3D'); } break;
    case 'roofAxis': roofOf(P).axis=roofAlong()==='x'?'y':'x'; commit(); setRoof(true); break;

async function connectCloud(col){
  let snap; try{ snap=await col.get(); }catch(e){ setSave('local'); return false; }
  Store.col=col; Store.mode='cloud';
  const cloud={}; snap.docs.forEach(d=>{ if(!d.exists) return; const p=unpack(d.id,d.data()); if(p) cloud[p.id]=p; });
  const hadCloud=Object.keys(cloud).length>0;
  if(hadCloud&&AUTO&&!cloud[AUTO]){ delete ALL[AUTO]; AUTO=null; }
  const push=[];
  new Set([...Object.keys(cloud),...Object.keys(ALL)]).forEach(k=>{ const a=ALL[k], c=cloud[k]; if(c&&(!a||c.updated>a.updated)) ALL[k]=c; else if(a&&(!c||a.updated>c.updated)) push.push(k); });
  AUTO=null; saveLocal();
  for(const k of push) await cloudWrite(k);
  if(!P||!ALL[P.id]) openProject(mostRecent());
  else if(ALL[P.id]!==P){ P=ALL[P.id]; openProject(P.id); }
  subscribeCurrent(); setSave('cloud'); if(UI.home) renderHome();
  return true;
}

function drawProjThumb(cv,p){
  const x=cv.getContext('2d'), W=cv.width, H=cv.height; x.setTransform(1,0,0,1,0,0); x.fillStyle=TK.plan; x.fillRect(0,0,W,H);
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; const add=(a,b)=>{ x0=Math.min(x0,a); x1=Math.max(x1,a); y0=Math.min(y0,b); y1=Math.max(y1,b); };
  p.rooms.forEach(r=>r.pts.forEach(q=>{ add(q[0]-p.wallT,q[1]-p.wallT); add(q[0]+p.wallT,q[1]+p.wallT); }));
  p.items.forEach(it=>itemCorners(it).forEach(q=>add(q[0],q[1])));
  if(x0>x1){ x.fillStyle=TK.muted; x.font='500 26px "IBM Plex Sans Thai",sans-serif'; x.textAlign='center'; x.textBaseline='middle'; x.fillText('ยังไม่มีห้อง',W/2,H/2); return true; }
  const s=Math.min((W-70)/(x1-x0),(H-70)/(y1-y0)), ox=W/2-(x0+x1)/2*s, oy=H/2-(y0+y1)/2*s, X=v=>ox+v*s, Y=v=>oy+v*s;
  x.strokeStyle=TK.grid; x.lineWidth=1; x.beginPath();
  for(let i=Math.floor(-ox/s);i<=(W-ox)/s;i++){ x.moveTo(Math.round(X(i))+0.5,0); x.lineTo(Math.round(X(i))+0.5,H); }
  for(let i=Math.floor(-oy/s);i<=(H-oy)/s;i++){ x.moveTo(0,Math.round(Y(i))+0.5); x.lineTo(W,Math.round(Y(i))+0.5); } x.stroke();
  const poly=pts=>{ x.beginPath(); pts.forEach((q,i)=>i?x.lineTo(X(q[0]),Y(q[1])):x.moveTo(X(q[0]),Y(q[1]))); x.closePath(); };
  p.rooms.forEach(r=>{ poly(r.pts); x.globalAlpha=0.6; x.fillStyle=r.floorColor; x.fill(); x.globalAlpha=1; });
  let ready=true;
  p.items.slice().sort((a,b)=>(isFlat(b)-isFlat(a))||((a.elev||0)-(b.elev||0))).forEach(it=>{
    const th=thumb(it.type,it.color), w=it.w*s, d=it.d*s; if(!th&&R3.ok) ready=false;
    x.save(); x.translate(X(it.x),Y(it.y)); x.rotate(it.rot*Math.PI/180);
    if(th) x.drawImage(th,-w/2,-d/2,w,d); else { x.fillStyle=it.color||'#b9b2a5'; x.fillRect(-w/2,-d/2,w,d); }
    x.strokeStyle=TK.itemLine; x.lineWidth=1; x.strokeRect(-w/2,-d/2,w,d); x.restore();
  });
  x.strokeStyle=TK.wall; x.lineJoin='miter'; x.lineWidth=Math.max(3,p.wallT*s); p.rooms.forEach(r=>{ poly(r.pts); x.stroke(); });
  return ready;
}

}
function showHome(){ blurField(); UI.home=true; UI.arm=null; UI.renaming=null; if(WK.on) setWalk(false); $('home').hidden=false; renderHome(); cloudRefresh().then(ch=>{ if(ch&&UI.home) renderHome(); }); }
function hideHome(){ UI.home=false; UI.renaming=null; UI.arm=null; $('home').hidden=true; requestAnimationFrame(()=>{ resizeAll(); fit2d(); if(R3.ok&&UI.view!=='2d') fit3d(); need2=true; need3=true; }); }
$('projBtn').addEventListener('click',showHome);
$('hBack').addEventListener('click',hideHome);
$('hNew').addEventListener('click',()=>addProject(starterProject(),'สร้างแปลนใหม่แล้ว'));
$('hTpl').addEventListener('click',()=>addProject(tplProject(),'เพิ่มแบบห้อง 1–2 แล้ว'));
$('hImport').addEventListener('click',()=>$('fileIn').click());
$('hCoop').addEventListener('click',()=>{ addProject(coopProject(),'เพิ่มเล้าไก่ตัวอย่างแล้ว แก้ขนาดหรือย้ายของได้ตามใจ'); setRoof(true); });
$('hMush').addEventListener('click',()=>{ addProject(mushroomProject(),'เพิ่มโรงเห็ดตัวอย่างแล้ว แก้ขนาดหรือย้ายของได้ตามใจ'); setRoof(true); });
$('home').addEventListener('click',e=>{
  const b=e.target.closest('[data-h]'); if(!b) return;
  const h=b.dataset.h, card=b.closest('.pcard'), id=card&&card.dataset.id, p=id&&ALL[id]; if(!p) return;
  if(h==='open'){ if(!P||id!==P.id) openProject(id); hideHome(); }
  else if(h==='rename'){ UI.renaming=id; UI.arm=null; renderHome(); }
  else if(h==='dup'){ const c=cleanProject(deep(p)); c.id=uid('p'); c.name=p.name+' (สำเนา)'; c.updated=Date.now(); putProject(c); renderHome(); toast('ทำสำเนา '+p.name+' แล้ว'); }
  else if(h==='export') saveFile(fileName(p)+'.json',JSON.stringify(p,null,1),'application/json');
  else if(h==='del'){
    if(UI.arm!=='del:'+id){ UI.arm='del:'+id; renderHome(); clearTimeout(armOnce.t); armOnce.t=setTimeout(()=>{ if(UI.arm==='del:'+id){ UI.arm=null; if(UI.home) renderHome(); } },3500); return; }
    UI.arm=null; deleteProject(id); renderHome(); toast('ลบ '+p.name+' แล้ว');
  }
});
$('home').addEventListener('keydown',e=>{ if(e.target.id!=='h-name') return; if(e.key==='Enter'){ e.preventDefault(); e.target.blur(); } else if(e.key==='Escape'){ e.preventDefault(); UI.renaming=null; renderHome(); } });
$('home').addEventListener('focusout',e=>{
  if(e.target.id!=='h-name'||!UI.renaming) return;
  const id=UI.renaming, p=ALL[id], t=e.target.value.trim().slice(0,80); UI.renaming=null;
  if(p&&t&&t!==p.name){ if(P&&id===P.id){ P.name=t; updProj(); commit(); } else { p.name=t; p.updated=Date.now(); putProject(p); } }
  const div=document.createElement('div'); div.className='pc-name'; div.textContent=p?p.name:t; e.target.replaceWith(div);
});
$('fileIn').addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0]; e.target.value=''; if(!f) return;
  const rdr=new FileReader(); rdr.onload=()=>{ let p=null; try{ p=cleanProject(JSON.parse(rdr.result)); }catch(err){} if(!p){ toast('ไฟล์นี้ไม่ใช่ไฟล์แปลนที่สำรองไว้'); return; } p.id=uid('p'); addProject(p,'เปิดไฟล์ '+p.name+' แล้ว'); }; rdr.readAsText(f);
});

/* ---------------- อื่น ๆ ---------------- */
let toastT=null;
function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('on'),2600); }
function onTheme(){ readTokens(); theme3d(); need2=true; if(UI.home) renderHome(); }
try{ window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',onTheme); }catch(e){}
try{ new MutationObserver(onTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']}); }catch(e){}
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{ need2=true; });
let lastT=performance.now();
function loop(t){
  requestAnimationFrame(loop); const dt=Math.min(0.05,Math.max(0,(t-lastT)/1000)); lastT=t;
  if(!UI.home){
    if(R3.ok&&UI.view!=='2d'){ if(WK.on&&stepWalk(dt)) need3=true; if(need3){ need3=false; updateWallCut(); R3.renderer.render(R3.scene,R3.cam); } }
    if(need2&&UI.view!=='3d') draw2d();
  }
  if(R3.ok&&THQ.length) processThumbs();
}

/* ---------------- เริ่ม ---------------- */
readTokens(); loadPrefs(); updWallBtn();
ALL=loadLocal();
let last=lsGet(LSL);
if(!Object.keys(ALL).length){ const t=tplProject(); ALL[t.id]=t; AUTO=t.id; last=t.id; }
if(!last||!ALL[last]) last=mostRecent();
init3d();
setSheet(isWide());
$('stage').dataset.view=UI.view==='split'&&!isWide()?'2d':UI.view;
resizeAll();
openProject(last);
setView(UI.view); setTool('select'); setSave('local');
$('roofBtn').setAttribute('aria-pressed',UI.roof?'true':'false'); $('wallBtn').disabled=UI.roof;
applyCam();
requestAnimationFrame(loop);
showHome();
initCloud().catch(()=>setSave('local'));
window.__room={get P(){return P;},C,select,addItem,setView,setTool,commit,undo,redo,act,openProject,fit2d,fit3d,PROB:()=>PROB,STATS:()=>STATS,Store,R3,setRoof,saveNow,exportPdf,makePdf,showHome,pick3,CAM,w2s,setNight,elecStats};
})();
</script>
</body></html>
